# CI pipeline (design.md Section 14.5): lint/typecheck -> unit -> functional
# -> benchmark -> e2e, each gate blocking the next.
#
# M4 scope note: `dashboard-api` / `dashboard-web` land in this update, joining
# `libs/py/rca_common`/`services/worker`/`services/gateway` (Python) and
# `probe`/`probe-gateway` (Go). Jobs are added incrementally as milestones
# deliver code, not stubbed out, so this workflow always reflects what
# actually exists and is 100%-green-enforceable today. The benchmark job
# covers every B* entry whose hot-path code has shipped (incl. B12 for M4
# dashboard hot endpoints). The manifest sanity check (tests/functional/
# test_manifests.py) runs once per event, in the independent `manifest-guard`
# job only (ci-runtime-1 FP-CIR1-2).
#
# Generated-code policy (design.md Section 11): `gen/go`, `gen/python`,
# `libs/py/rca_common/rca_common/schemas/generated`, and
# `web/src/types/generated` are all gitignored -- never committed, always
# freshly regenerated from `proto/*.proto` / `schemas/*.schema.json` by
# `scripts/gen-proto.sh` / `schemas/generate-pydantic.sh` /
# `schemas/generate-ts.js`. Every job below that actually compiles/imports
# generated code regenerates it itself (toolchain installed in that same
# job); jobs that don't touch generated code deliberately skip this step.
# Today that means: `lint` (go vet), every Go-testing job that builds
# product code (`unit-go`, `benchmark`), and `functional` -- whose Python
# F15/F16 tests (`test_m6_go_config_env_interpolation.py`,
# `test_m6_audit_completeness.py`) launch `go build` / `go test` subprocesses
# against packages that import `gen/go` -- regenerate `gen/go` (and, as a
# side effect of `scripts/gen-proto.sh` doing both in one pass, `gen/python`
# too).
# `manifest-guard` is the deliberate exception: it is a parser-only guard
# (`go/ast`, `go/parser`, `gopkg.in/yaml.v3`) that reads sources as text and
# imports no generated package, so it compiles and runs with no generated
# code present. Omitting codegen there is INTENTIONAL -- do not "fix" it by
# adding buf/protoc steps; they would add a network dependency and ~1 min of
# setup to the one job that must be able to run on its own (design.md
# Section 11.1.3, errata pass 20 clause (AS)(2), errata pass 21 clause (BA)).
# `unit-rca-common`, `unit-worker`, `unit-gateway`, and `unit-dashboard-api`
# regenerate nothing: no test in those suites imports generated schemas.
# `unit-web` does not import `web/src/types/generated` at runtime under
# coverage (those files are excluded from the vitest coverage denominator).

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']                 # release runs of the e2e job
  pull_request:
    branches: [main]                                  # e2e runs on every PR targeting main
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 3 * * *'          # nightly e2e
  # bench-on-demand FP-BOD-1: the manual event stays, with NO inputs. The two
  # booleans that ran the GC-3 topology sweep and the CPU-basis oracle are
  # deleted with the targets they selected. Deleting the event itself would
  # remove a way to re-run the functional e2e job by hand, which this slice
  # does not touch.
  workflow_dispatch:

jobs:
  lint:
    name: lint / typecheck (rca_common, worker, probe, probe-gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
          # Without a token the action resolves the buf release over the
          # UNAUTHENTICATED GitHub API, rate-limited per runner IP on a shared
          # pool -- it failed `benchmark` on run 31900475784 and passed on a
          # bare re-run. GITHUB_TOKEN is minted per run; no secret to provision.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protoc-gen-go / protoc-gen-go-grpc (pinned, matches local dev)
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Regenerate gen/go + gen/python from proto/ (scripts/gen-proto.sh)
        run: bash scripts/gen-proto.sh
      - name: Byte-compile sanity check (Python)
        run: |
          python -m compileall -q \
            libs/py/rca_common/rca_common \
            services/worker/worker services/worker/scripts \
            services/gateway/gateway \
            services/dashboard-api/dashboard_api \
            tests
      - name: go vet (Go)
        run: go vet ./...
      # TODO(M5+): adopt a real linter (ruff for Python, golangci-lint for
      # Go) plus the TS typecheck gate for dashboard-web, so lint config is
      # decided once for the whole monorepo rather than piecemeal.

  # Independent gate (design.md §11.1.3 errata pass 20, clause (AS)):
  # this job deliberately has NO `needs:` and NO `if:`. Every other job in
  # this workflow is downstream of `lint`, so a skip of `lint` cascades and
  # a skipped check run reads as passing to branch protection -- which would
  # leave the workflow's own guard among the things that did not run.
  # Do not add a dependency, a condition or a matrix to this job.
  #
  # `name:` MUST stay byte-equal to the job id (design.md errata pass 21,
  # clause (AX)): GitHub emits this job's status-check context under `name:`,
  # and `manifest-guard` is the context this repository's branch protection
  # requires. Renaming the job silently renames that context, and a required
  # check that no longer reports leaves every PR pending. Do not "improve"
  # this name.
  manifest-guard:
    name: manifest-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Install test deps
        run: |
          python -m venv services/worker/.venv
          services/worker/.venv/bin/pip install --upgrade pip
          services/worker/.venv/bin/pip install -e libs/py/rca_common
          services/worker/.venv/bin/pip install -e "services/worker[test]"
          services/worker/.venv/bin/pip install -e "services/gateway[test]"
          services/worker/.venv/bin/pip install -e "services/dashboard-api[test]"
      # FP-M6-31 A10(v): runtime env hygiene immediately before the guard's own
      # pytest process (ordinary import mode; a PYTHONPATH would own the guard).
      - name: FP-M6-31 A10(v) environment hygiene before the guard pytest
        run: |
          bad="$(awk 'BEGIN { for (k in ENVIRON) { p = substr(k, 1, 6); if (p != "PYTHON" && p != "PYTEST") continue; print k } }')"; if [ -n "$bad" ]; then printf 'FP-M6-31 A10(v): forbidden PYTHON*/PYTEST* environment key present before the measured invocation:\n%s\n' "$bad" >&2; exit 1; fi
      - name: Manifest honesty + CI pin (Python half)
        run: |
          services/worker/.venv/bin/python -m pytest \
            tests/functional/test_manifests.py -v
      - name: Manifest honesty (Go half)
        run: go test ./tests/functional/manifest_honesty/... -v -timeout 300s

  unit-rca-common:
    name: unit tests - rca_common (>80% coverage per module)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rca_common (test extras)
        working-directory: libs/py/rca_common
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[test]"
      - name: pytest --cov (100% pass rate, >80% coverage, every module)
        working-directory: libs/py/rca_common
        run: |
          .venv/bin/python -m pytest tests/ \
            --cov=rca_common --cov-report=term-missing --cov-fail-under=81
          bash ../../../scripts/py-coverage-check.sh 80 rca_common

  unit-worker:
    name: unit tests - worker (>80% coverage per module)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rca_common + worker (test extras)
        run: |
          python -m venv services/worker/.venv
          services/worker/.venv/bin/pip install --upgrade pip
          services/worker/.venv/bin/pip install -e libs/py/rca_common
          services/worker/.venv/bin/pip install -e "services/worker[test]"
      - name: pytest --cov (100% pass rate, >80% coverage, every module)
        working-directory: services/worker
        run: |
          .venv/bin/python -m pytest tests/ \
            --cov=worker --cov=scripts --cov-report=term-missing --cov-fail-under=81
          bash ../../scripts/py-coverage-check.sh 80 worker scripts

  unit-gateway:
    name: unit tests - ingest-gateway (>80% coverage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rca_common + gateway (test extras)
        run: |
          python -m venv services/gateway/.venv
          services/gateway/.venv/bin/pip install --upgrade pip
          services/gateway/.venv/bin/pip install -e libs/py/rca_common
          services/gateway/.venv/bin/pip install -e "services/gateway[test]"
      - name: pytest --cov (100% pass rate, >80% coverage)
        working-directory: services/gateway
        run: |
          .venv/bin/python -m pytest tests/ \
            --cov=gateway --cov-report=term-missing --cov-fail-under=81 \
            --ignore=tests/test_b1_ingest_burst.py
          bash ../../scripts/py-coverage-check.sh 80 gateway

  unit-dashboard-api:
    name: unit tests - dashboard-api (>80% coverage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rca_common + dashboard-api (test extras)
        run: |
          python -m venv services/dashboard-api/.venv
          services/dashboard-api/.venv/bin/pip install --upgrade pip
          services/dashboard-api/.venv/bin/pip install -e libs/py/rca_common
          services/dashboard-api/.venv/bin/pip install -e "services/dashboard-api[test]"
      - name: pytest --cov (100% pass rate, >80% coverage)
        working-directory: services/dashboard-api
        run: |
          .venv/bin/python -m pytest tests/ \
            --cov=dashboard_api --cov-report=term-missing --cov-fail-under=81
          bash ../../scripts/py-coverage-check.sh 80 dashboard_api

  unit-web:
    name: unit tests - dashboard-web (vitest, >80% coverage per file)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: vitest --coverage (100% pass rate, >80% per-file thresholds)
        working-directory: web
        run: npm test

  unit-go:
    name: unit tests - probe, probe-gateway (>80% coverage per package)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
          # Without a token the action resolves the buf release over the
          # UNAUTHENTICATED GitHub API, rate-limited per runner IP on a shared
          # pool -- it failed `benchmark` on run 31900475784 and passed on a
          # bare re-run. GITHUB_TOKEN is minted per run; no secret to provision.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protoc-gen-go / protoc-gen-go-grpc (pinned, matches local dev)
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Regenerate gen/go + gen/python from proto/ (scripts/gen-proto.sh)
        run: bash scripts/gen-proto.sh
      - name: Install rca_common (needed by registry/pg_test.go's real-Postgres
          tests, which shell out to alembic against a testcontainers Postgres)
        working-directory: libs/py/rca_common
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[test]"
      # -p 1: serialize package execution. This job runs at least two
      # packages (registry, tests/functional/m2_probe_link) that each spin
      # up their own real ephemeral Postgres testcontainer; run concurrently
      # (go test's default per-package parallelism) on a standard 2-core
      # GitHub-hosted runner, they starve each other for Docker/CPU and the
      # later container becomes unreachable -- observed failing 3 of 4 CI
      # runs with "connection refused" before this was added. Serializing
      # doesn't weaken the race detector or any assertion, just scheduling.
      #
      # ci-runtime-1 FP-CIR1-3/4: ONE package pass proves both Go bars. The
      # same -race execution writes the atomic coverage profile, and the next
      # step reads that exact file instead of running the suite a second time.
      # `./...` includes tests/functional/m2_probe_link (F8/F9), which is why
      # the functional job no longer runs it directly. A failing test fails
      # this step, and the default `bash -e` shell never reaches the checker.
      - name: go test -race -coverprofile (100% pass rate, one pass)
        run: go test ./... -race -coverprofile=/tmp/dbagent-ci-go.coverprofile -covermode=atomic -timeout 300s -p 1
      - name: per-package coverage gate (>80%, excluding generated code + main())
        run: bash scripts/go-coverage-check.sh 80 /tmp/dbagent-ci-go.coverprofile

  functional:
    name: functional tests (M1–M6 + manifest checks)
    runs-on: ubuntu-latest
    needs:
      [
        unit-rca-common,
        unit-worker,
        unit-gateway,
        unit-dashboard-api,
        unit-web,
        unit-go,
      ]
    steps:
      # GC-3 (FP-GC3-7): the delivery tier repeats every retained
      # supersession edge's strict-descendant proof with
      # `git merge-base --is-ancestor` over this checkout's own object
      # database. A shallow clone cannot see a superseded head at all, and the
      # proof correctly fails closed with `gc3_ancestry_unavailable`; full
      # history is what makes it answerable. No other job needs it: the
      # discovery job proves no ancestry and the benchmark route spawns no Git.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
          # Without a token the action resolves the buf release over the
          # UNAUTHENTICATED GitHub API, rate-limited per runner IP on a shared
          # pool -- it failed `benchmark` on run 31900475784 and passed on a
          # bare re-run. GITHUB_TOKEN is minted per run; no secret to provision.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protoc-gen-go / protoc-gen-go-grpc (pinned, matches local dev)
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Regenerate gen/go + gen/python from proto/ (scripts/gen-proto.sh;
          needed by F15/F16 below, whose Python tests launch go build / go test
          subprocesses against packages that import gen/go)
        run: bash scripts/gen-proto.sh
      - name: Install rca_common + worker + gateway + dashboard-api (test extras)
        run: |
          python -m venv services/worker/.venv
          services/worker/.venv/bin/pip install --upgrade pip
          services/worker/.venv/bin/pip install -e libs/py/rca_common
          services/worker/.venv/bin/pip install -e "services/worker[test]"
          services/worker/.venv/bin/pip install -e "services/gateway[test]"
          services/worker/.venv/bin/pip install -e "services/dashboard-api[test]"
      - name: Install helm (pinned from deploy/versions.env)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source deploy/versions.env
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tgz
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version
      # FP-M6-31 A10(v): runtime env hygiene immediately before the guard's own
      # pytest process (ordinary import mode; a PYTHONPATH would own the guard).
      - name: FP-M6-31 A10(v) environment hygiene before functional pytest
        run: |
          bad="$(awk 'BEGIN { for (k in ENVIRON) { p = substr(k, 1, 6); if (p != "PYTHON" && p != "PYTEST") continue; print k } }')"; if [ -n "$bad" ]; then printf 'FP-M6-31 A10(v): forbidden PYTHON*/PYTEST* environment key present before the measured invocation:\n%s\n' "$bad" >&2; exit 1; fi
      - name: Run Python functional tests
        # Docker is preinstalled on GitHub-hosted ubuntu-latest runners;
        # testcontainers (ephemeral Postgres/MinIO) and Temporal's real
        # local dev server (temporalio.testing.WorkflowEnvironment) both
        # use it directly -- see tests/functional/conftest.py.
        # tests/delivery is the packaging/docs/CI assertion tier (FP-M6-*).
        #
        # bench-on-demand FP-BOD-1/5 (design.md §3.2): the B1 harness coverage
        # gate moves here out of the deleted `b1_write_coverage_driver`
        # container, and the tag-gate script's own branch-coverage run joins
        # it; kind-deploy-tuning (§5 Unit tests) adds the kind p99 observation
        # helper's branch-coverage run beside it. All live in THIS step's body
        # rather than in steps of their own,
        # because FP-M6-31 A10(v) pins exactly one measured pytest step per
        # guarded job, immediately after the hygiene gate above; a second step
        # would move those invocations away from their gate. The default
        # `bash -e` shell fails the step on the first non-zero command, so no
        # failure here is swallowed. The coverage bar stays 81 on the three
        # surviving files, its data file lives under RUNNER_TEMP rather than
        # /run/dbagent-b1, and its --include paths are repository-relative
        # rather than /workspace.
        #
        # ci-runtime-1 FP-CIR1-2: the broad pytest's last --ignore names ONE
        # file, tests/functional/test_manifests.py. Its tests are not skipped:
        # they run once per event in the independent `manifest-guard` job, a
        # required status check with no needs/if.
        run: |
          services/worker/.venv/bin/python -m pytest \
            services/worker/tests services/gateway/tests \
            services/dashboard-api/tests \
            tests/functional tests/delivery tests/mocks/llm -v \
            --ignore=tests/functional/m2_probe_link \
            --ignore=services/gateway/tests/test_b1_ingest_burst.py \
            --ignore=tests/delivery/test_delivery_sizing_ledger.py \
            --ignore=tests/functional/test_manifests.py
          services/worker/.venv/bin/python -m pytest \
            tests/functional/test_release_bench_record.py -v \
            --cov=check_release_bench_record --cov-branch --cov-fail-under=81
          services/worker/.venv/bin/python -m pytest tests/delivery/test_kind_deploy_tuning.py -v --cov=tests.e2e.kind_b1_observation --cov-branch --cov-fail-under=81
          env -u PYTHON_VERSION -u PYTHON_PIP_VERSION -u PYTHON_GET_PIP_URL -u PYTHON_GET_PIP_SHA256 \
            services/worker/.venv/bin/python -B -m coverage run --branch \
            --data-file="$RUNNER_TEMP/b1-harness.coverage" \
            -m pytest services/gateway/tests/test_b1_ingest_burst.py -v \
            -m "not b1_live and not b1_product"
          services/worker/.venv/bin/python -B -m coverage report --data-file="$RUNNER_TEMP/b1-harness.coverage" --fail-under=81 --include=services/gateway/tests/b1_reference_profile.py,services/gateway/tests/test_b1_ingest_burst.py,scripts/b1-affinity-helper.py
          services/worker/.venv/bin/python -B -m coverage report --data-file="$RUNNER_TEMP/b1-harness.coverage" --fail-under=81 --include=services/gateway/tests/b1_reference_profile.py
          services/worker/.venv/bin/python -B -m coverage report --data-file="$RUNNER_TEMP/b1-harness.coverage" --fail-under=81 --include=services/gateway/tests/test_b1_ingest_burst.py
          services/worker/.venv/bin/python -B -m coverage report --data-file="$RUNNER_TEMP/b1-harness.coverage" --fail-under=81 --include=scripts/b1-affinity-helper.py
      # ci-runtime-1 FP-CIR1-4: the direct `go test ./tests/functional/...`
      # step is gone. unit-go's `go test ./... -race ... -p 1` already runs
      # tests/functional/m2_probe_link (F8/F9); manifest-guard keeps its own
      # independent Go honesty half.

  benchmark:
    name: benchmark (B3–B6/B9/B12–B14 + M3/M4 Python benches; manifest check)
    runs-on: ubuntu-latest
    needs: functional
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
          # Without a token the action resolves the buf release over the
          # UNAUTHENTICATED GitHub API, rate-limited per runner IP on a shared
          # pool -- it failed `benchmark` on run 31900475784 and passed on a
          # bare re-run. GITHUB_TOKEN is minted per run; no secret to provision.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protoc-gen-go / protoc-gen-go-grpc (pinned, matches local dev)
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Regenerate gen/go + gen/python from proto/ (scripts/gen-proto.sh;
          needed by the B3 probe-gateway benchmark below)
        run: bash scripts/gen-proto.sh
      - name: Install test deps
        run: |
          python -m venv services/worker/.venv
          services/worker/.venv/bin/pip install --upgrade pip
          services/worker/.venv/bin/pip install -e libs/py/rca_common
          services/worker/.venv/bin/pip install -e "services/worker[test]"
          services/worker/.venv/bin/pip install -e "services/gateway[test]"
          services/worker/.venv/bin/pip install -e "services/dashboard-api[test]"
      # ci-runtime-1 FP-CIR1-2: no manifest-validation step here. The
      # thresholds.yaml honesty rule is asserted by the independent, required
      # `manifest-guard` job on every event, so this job no longer repeats
      # the same suite.
      - name: B3 -- probe-gateway 100-concurrent-session dispatch p99
        run: go test ./services/probe-gateway/internal/gwserver/... -run TestB3 -v -timeout 60s
      - name: B4 -- chunked result streaming (1 MiB / 256 KiB chunks, 50 concurrent tasks)
        run: go test ./services/probe-gateway/internal/gwserver/... -run TestB4 -v -timeout 60s
      - name: B5 -- redaction filter over a 1 MiB config payload
        run: go test ./probe/internal/redact/... -run TestB5 -v -timeout 60s
      - name: B6 -- static raw-command validator < 5 ms
        run: |
          services/worker/.venv/bin/python -m pytest \
            libs/py/rca_common/tests/test_rawcmd.py::test_b6_static_validator_under_5ms -v
      - name: B9 -- presto_query_json_section JSONPath slice over a 10 MB query JSON
        run: go test ./probe/internal/adapter/presto/... -run TestB9 -v -timeout 60s
      - name: B12 -- dashboard hot endpoints p99 < 300 ms (50 concurrent users)
        run: |
          services/worker/.venv/bin/python -m pytest \
            services/dashboard-api/tests/test_b12_hot_endpoints.py -v
      - name: B13 -- workflow round-loop overhead < 1 s/round
        run: |
          services/worker/.venv/bin/python -m pytest \
            services/worker/tests/test_investigation_workflow.py::test_b13_round_loop_overhead_under_1s -v
      - name: B14 -- RCA context assembly < 200 ms
        run: |
          services/worker/.venv/bin/python -m pytest \
            services/worker/tests/test_context_assembly.py::test_b14_prompt_build_under_200ms_and_no_latest_truncation -v

      # bench-on-demand FP-BOD-1: the B1 step and the hygiene step that existed
      # only immediately before it are deleted; B1 runs on demand on a developer
      # host. Nothing here is skipped or conditioned -- the steps are gone.
      #
      # One step so the session-scoped scale_pg seed is shared by B2/B10
      # (§11.1.3 — seeding twice would double the cost). Test ids name each bar.
      # No --timeout flag: pytest-timeout is not a declared dependency.
      # -s: keep the fixed-prefix diagnostics on a green run (errata pass 9).
      # The operands are the NODE IDS of every top-level test in that file
      # except the live B11 audit/LLM insert-throughput node, which left CI
      # with B1 and is now measured on demand.
      # Collecting the whole file would run the live B11 throughput test again.
      # FP-M6-31 A10(v): runtime env hygiene immediately before the measured step.
      - name: FP-M6-31 A10(v) environment hygiene before B2/B10
        run: |
          bad="$(awk 'BEGIN { for (k in ENVIRON) { p = substr(k, 1, 6); if (p != "PYTHON" && p != "PYTEST") continue; print k } }')"; if [ -n "$bad" ]; then printf 'FP-M6-31 A10(v): forbidden PYTHON*/PYTEST* environment key present before the measured invocation:\n%s\n' "$bad" >&2; exit 1; fi
      - name: B2/B10 -- PG scale benchmarks (shared seeded fixture)
        run: |
          services/worker/.venv/bin/python -m pytest \
            tests/benchmark/test_pg_scale.py::test_b2_fingerprint_correlation_p99_under_20ms \
            tests/benchmark/test_pg_scale.py::test_b10_partitioned_list_and_filter_p99 \
            tests/benchmark/test_pg_scale.py::test_b11_host_parser_reuse_is_direct \
            tests/benchmark/test_pg_scale.py::test_b11_host_diagnostics_read_declared_sources \
            tests/benchmark/test_pg_scale.py::test_b11_host_reader_observes_real_proc_stat \
            tests/benchmark/test_pg_scale.py::test_b11_storage_identity_reads_target_postgres_container \
            tests/benchmark/test_pg_scale.py::test_b11_storage_identity_fails_soft_without_substituting_another_mount \
            tests/benchmark/test_pg_scale.py::test_b11_diagnostics_schema_is_canonical_and_comma_safe \
            tests/benchmark/test_pg_scale.py::test_b11_diagnostic_sampling_brackets_the_timed_window \
            -v -s
      # FP-IG-23 / FP-BOD-9: the sizing ledger is a STATIC provenance gate now.
      # It reads the five recorded historical costs and the chart figures out of
      # deploy/charts/dbagent/values.yaml and fails a silent edit of either. It
      # has no live producer in this workflow any more and needs none: nothing
      # re-derives 1.585. No third A10(v) gate: every uses: step precedes index
      # 7 and only parsed run: bodies sit between the pinned gate and this step.
      - name: FP-IG-23 -- sizing-ledger provenance gate
        run: |
          services/worker/.venv/bin/python -m pytest \
            tests/delivery/test_delivery_sizing_ledger.py -v
      # v1.5 manifest honesty rule (design.md Section 14.4): a
      # thresholds.yaml entry cannot stay `deferred` once its hot-path code
      # ships. M3 flipped B1/B2/B6/B8/B11/B13/B14; M4 flipped B12.

  # bench-on-demand FP-BOD-5: the `v*` tag gate. It reads the committed record
  # of the two on-demand benchmark runs out of the TAGGED tree and refuses the
  # tag unless that record is a measurement of this tree and its own tokens show
  # both bars met. It runs neither benchmark: `b1_product` needs eight logical
  # CPUs and every runner here is a four-vCPU ubuntu-latest.
  release-bench-record:
    name: release bench record (v* tags)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # fetch-depth: 0 plus an explicit fetch of the release branch: the script
      # proves ancestry against origin/main and walks from the measured commit
      # to the tag commit, and a shallow clone can see neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the release branch
        run: git fetch origin main:refs/remotes/origin/main
      - name: Check the release bench record
        run: python3 scripts/check_release_bench_record.py

  images:
    name: build product images (six)
    runs-on: ubuntu-latest
    needs: [lint, release-bench-record]
    # `always()` is what lets this job run on a pull request, where
    # `release-bench-record` is skipped. A FAILED record job is neither
    # `success` nor `skipped`, so images does not build and does not push.
    if: >
      always() &&
      needs.lint.result == 'success' &&
      (needs.release-bench-record.result == 'success' || needs.release-bench-record.result == 'skipped')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
          # Without a token the action resolves the buf release over the
          # UNAUTHENTICATED GitHub API, rate-limited per runner IP on a shared
          # pool -- it failed `benchmark` on run 31900475784 and passed on a
          # bare re-run. GITHUB_TOKEN is minted per run; no secret to provision.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protoc-gen-go / protoc-gen-go-grpc
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Source pins and build all six images
        run: |
          set -euo pipefail
          source deploy/versions.env
          export SHORT_SHA="${GITHUB_SHA::12}"
          bash deploy/docker/build.sh
      - name: Push to GHCR (main and tags only)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          source deploy/versions.env
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          SHORT_SHA="${GITHUB_SHA::12}"
          for c in ingest-gateway temporal-worker probe-gateway dashboard-api dashboard-web probe; do
            docker push "${REGISTRY}/${c}:${APP_VERSION}"
            docker push "${REGISTRY}/${c}:sha-${SHORT_SHA}"
          done

  e2e:
    name: e2e (kind + Presto 0.298 + Section 13 scenarios)
    runs-on: ubuntu-latest
    needs: functional
    timeout-minutes: 30
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
          # Without a token the action resolves the buf release over the
          # UNAUTHENTICATED GitHub API, rate-limited per runner IP on a shared
          # pool -- it failed `benchmark` on run 31900475784 and passed on a
          # bare re-run. GITHUB_TOKEN is minted per run; no secret to provision.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protoc plugins, helm, kind
        run: |
          set -euo pipefail
          source deploy/versions.env
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSL "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64" -o /tmp/kind
          chmod +x /tmp/kind && sudo mv /tmp/kind /usr/local/bin/kind
      - name: Run e2e (1500s product budget inside 30m job)
        run: bash tests/e2e/run.sh
      - name: Upload phase timing and pod logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: |
            /tmp/rca-e2e/**
            tests/e2e/*.log
          if-no-files-found: ignore
