  - id: F14
    description: "Tracing (design.md D5, 7)"
    owning_milestone: M1
    status: partial
    tests:
      - tests/functional/test_m1_foundation.py::test_one_model_call_produces_llm_calls_row_and_s3_objects
    notes: >
      Covered now: "builtin" backend -- one real model call (against the
      mocked LLM provider) produces a real `llm_calls` row (ephemeral
      Postgres, migrated schema) and real prompt/response objects
      (ephemeral MinIO). This is M1's Section 12 acceptance criterion.
      Not yet covered functionally: the "both"/Langfuse-mock-receiver case
      and cross-investigation spend aggregation. The dual-write matrix
      itself (builtin/langfuse/both) is unit-tested
      (libs/py/rca_common/tests/test_llmclient.py ::
      test_generate_dual_write_matrix); wiring a real Langfuse mock
      receiver into the functional tier is deferred alongside the rest of
      the notification/observability-adjacent functional surface (no
      milestone explicitly owns it yet; revisit at M3 when
      InvestigationWorkflow starts making real multi-round model calls).

  - id: F15
    description: "Config & policy (Appendix E)"
    owning_milestone: M1
    status: partial
    tests: []
    notes: >
      `data_egress_policy: local_only` startup validation and env-var
      interpolation are unit-tested in M1
      (libs/py/rca_common/tests/test_config.py). `platforms.config` (JSONB)
      is now populated for real as of M2 (services/probe-gateway/internal/
      registry.CreatePlatform, currently storing the bootstrap-token
      bookkeeping this session added -- see F8's notes), and
      per-platform-config *reads* work as plain JSONB round-trips
      (registry/pg_test.go). What's still missing: the specific
      budget/model/data_egress_policy/health_query *override* semantics
      Appendix E describes (control-plane code that actually reads
      `platforms.config` and merges it over the deployment-wide YAML
      defaults) -- that consumer doesn't exist until temporal-worker's
      Activities do (M3), so the override-precedence slice of F15 stays
      deferred to M3.

