  - id: F7
    description: "Structured output discipline (design.md 6)"
    owning_milestone: M3
    status: partial
    tests: []
    notes: >
      The retry-once-then-fail mechanism itself lives in
      rca_common.llmclient.client.LLMClient.generate() and is fully unit-
      tested in M1 (libs/py/rca_common/tests/test_llmclient.py ::
      test_generate_retries_once_on_schema_failure_then_succeeds,
      test_generate_raises_llm_output_error_after_second_schema_failure).
      F7 as a *functional* checkpoint additionally requires observing the
      Activity-failure propagation into a real Workflow, which needs
      InvestigationWorkflow (M3).

  - id: F8
    description: "Registration flow v3 (design.md 8.4)"
    owning_milestone: M2
    status: covered
    tests:
      - tests/functional/m2_probe_link/registration_test.go::TestF8_RegistrationFlow_NoneAuth_BecomesOnline
      - tests/functional/m2_probe_link/registration_test.go::TestF8_RegistrationFlow_PasswordAuthNoCredentials_BecomesPendingCredentials
      - tests/functional/m2_probe_link/registration_test.go::TestF8_BootstrapTokenSingleUse_SecondEnrollWithSameTokenFails
      - tests/functional/m2_probe_link/registration_test.go::TestF8_HeartbeatTimeout_MarksProbeOffline
      - services/probe-gateway/internal/gwserver/server_test.go (auth-scheme -> platform-status mapping, incl. KERBEROS "unsupported" -> degraded)
      - services/probe-gateway/internal/bootstrapsrv/server_test.go (bootstrap token validation matrix)
      - probe/cmd/probe/main_test.go::TestEnsureEnrolled_* (enroll/persist/reuse/failure paths)
    notes: >
      Covered via real compiled `probe` + `probe-gateway` binaries run as
      OS subprocesses talking over real mTLS (bootstrap CA issued/loaded
      for real, client certs signed for real), against a real ephemeral
      Postgres migrated with the exact M1 alembic migration, with only the
      platform-side externals mocked (fake Presto REST + fake Docker
      Engine API, both httptest) -- this is what "cross-service tier" (
      design.md Section 11) means for M2, since Go's internal-package
      visibility rules don't let one test file import both probe/internal/...
      and services/probe-gateway/internal/... (see impl-progress.md).
      Steps 1-2 (dashboard creates platform + bootstrap token) are
      dashboard-api's job (M4, not built yet); this tier's tests seed that
      precondition directly via SQL, matching how M1 treated
      dashboard-dependent preconditions. TLS CA resolution order and the
      Swarm `docker secret create`/`service update` credential-rotation
      path are unit-tested (probe/internal/credentials,
      probe/internal/adapter/presto/auth_test.go) but not re-proven at the
      subprocess level (redundant with the unit coverage already there).

  - id: F9
    description: "Toolpack dispatch (design.md 8.5, Appendix A/B)"
    owning_milestone: M2
    status: partial
    tests:
      - probe/internal/sessionclient/dispatch_test.go (every TaskRequest kind incl. ToolCall/RawCommand/RemediationStep/HealthCheck; per-tool coverage via probe/internal/adapter/presto's ~50 tests)
      - probe/internal/sessionclient/client_test.go::TestClient_DispatchesTaskAndSendsChunkedResult (real chunk encoding + envelope JSON)
      - services/probe-gateway/internal/gwserver/server_test.go::TestDispatch_ReassemblesMultipleChunksInOrder (chunk order)
      - services/probe-gateway/internal/gwserver/server_test.go::TestDispatch_ChunkCountMismatchIsSurfacedAsError (chunk_count integrity)
      - services/probe-gateway/internal/gwserver/server_test.go::TestDispatch_MissingChunkSeqIsSurfacedAsError (missing chunk)
      - services/probe-gateway/internal/gwserver/server_test.go::TestDispatch_TimesOutWhenProbeDoesNotReply (task timeout)
      - services/probe-gateway/internal/gwserver/server_test.go::TestCancelTask_DeliversCancelFrame (CancelTask)
      - probe/internal/adapter/presto/adapter_test.go::TestExecute_ConfigToolRedaction (redaction of catalog secrets in presto_config)
      - probe/internal/sessionclient/dispatch_test.go::TestHandleTask_ToolCall_TruncatesAtMaxOutputBytes (truncated=true at output cap)
    notes: >
      Covered: every element design.md Section 14.3 names for F9 --
      per-tool envelope correctness (all ~20 Toolpack tools, via the
      presto adapter test suite), chunked reassembly (order/integrity/
      missing-chunk), redaction, truncation, task timeout, CancelTask --
      each proven with REAL production code on both sides (real
      sessionclient.HandleTask/ChunkPayload on the probe side, real
      gwserver.Dispatch/chunk-reassembly on the gateway side), following
      design.md Section 14.3's own "a fake probe (in-process ... with a
      scripted PlatformAdapter returning fixture data)" pattern -- just
      split across two co-located test suites (one per service) rather
      than one file, since Go's internal-package rules don't allow a
      single test to import both sides' internals (see F8's notes and
      impl-progress.md).
      Not yet covered: a single test with the REAL probe binary AND real
      probe-gateway binary AND a third-party caller triggering dispatch
      end to end in three separate processes. `gwserver.Server.Dispatch`
      has no external (gRPC/HTTP) trigger surface yet -- design.md Section
      3.2's "exposes internal ExecuteTool(platform_key, task) API for
      Activities" is explicitly deferred to M3, since no Activity exists
      yet to call it (documented decision, gwserver.go's own doc comment).
      Also not yet covered: S3 storage + `evidence` row persistence for
      dispatched results -- that's the M3 Activity's job once it exists,
      not probe-gateway's.

