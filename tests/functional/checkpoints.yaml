# Functional checkpoint manifest (design.md Section 14.3). Every checkpoint
# F1-F16 from the Section 14.3 table is listed here. "Checkpoint coverage is
# exhaustive by construction: ... every row must map to at least one
# functional test, and CI runs a manifest check ... that fails if any
# checkpoint has no linked test" -- that CI manifest-check script is part of
# the M6 delivery/CI packaging work (design.md Section 14.5); until it lands,
# this file is the authoritative, human/CI-readable inventory. Each entry's
# `status` distinguishes "covered now" from "the owning milestone hasn't
# built the checkpointed behavior yet", so the eventual manifest check can be
# written to only require `tests` to be non-empty for checkpoints whose
# `owning_milestone` has already shipped.

schema_version: 1

checkpoints:
