    (chunk_count integrity)
  - services/probe-gateway/internal/gwserver/server_test.go::TestDispatch_MissingChunkSeqIsSurfacedAsError
    (missing chunk)
  - services/probe-gateway/internal/gwserver/server_test.go::TestDispatch_TimesOutWhenProbeDoesNotReply
    (task timeout)
  - services/probe-gateway/internal/gwserver/server_test.go::TestCancelTask_DeliversCancelFrame (CancelTask)
  - probe/internal/adapter/presto/adapter_test.go::TestExecute_ConfigToolRedaction (redaction of catalog
    secrets in presto_config)
  - probe/internal/sessionclient/dispatch_test.go::TestHandleTask_ToolCall_TruncatesAtMaxOutputBytes (truncated=true
    at output cap)
  - tests/functional/m2_probe_link/tool_dispatch_test.go
  notes: 'M6 closed the three-separate-processes gap via tool_dispatch_test.go (real probe + real probe-gateway
    + HTTP caller over real mTLS): envelope correctness, chunked reassembly of >256 KiB payloads, truncation
    at max_output_bytes, catalog-secret redaction, task timeout and CancelTask. Evidence/S3 persistence
    for dispatched results is covered by the M3 collector activity tests (services/worker/tests/test_investigation_activities.py).
    In-process per-tool and chunk-reassembly coverage from M2 remains linked above.'
