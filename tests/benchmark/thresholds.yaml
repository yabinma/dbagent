- id: B9
  description: presto_query_json_section JSONPath slice over a 10 MB query JSON (deep-read path)
  threshold: < 500 ms
  owning_milestone: M2
  status: covered
  tests:
  - probe/internal/adapter/presto/bench_test.go::TestB9_PrestoQueryJSONSection_10MBQueryJSON
  notes: 'v1.5 manifest-honesty fix (review.md W2): toolPrestoQueryJSONSection (tools_engine.go) shipped
    in M2, so this had to stop being `deferred`. Drives the real toolFunc end-to-end (a.Execute -> prestoclient.GetJSON
    -> jsonpath.Get) against a real httptest `/v1/query/{id}` response >= 10 MB (a deeply-nested outputStage
    tree with realistic per-operator stats, per Appendix B.1''s "payloads can reach MBs"), matching the
    design table''s "deep-read path" framing (JSON decode + JSONPath walk, not just the JSONPath library
    in isolation). Measured on this dev machine: ~55-58ms, comfortably under the 500ms budget. Excluded
    from `-race` builds (`//go:build !race`, same rationale as B5): a 10 MB JSON decode is CPU/allocation-heavy
    and the race detector inflates it past the threshold (measured >530ms under -race for the same workload)
    in a way that isn''t representative of production latency; `go test ./...` (no -race) still enforces
    the real threshold.

    '
- id: B10
  description: "PG partitioned-table queries: case list w/ cursor and history filters \u2014 12 monthly\
    \ partitions, 100k investigations, 5M llm_calls/audit_log rows"
  threshold: list/filter p99 < 200 ms
  owning_milestone: M6
  status: covered
  tests:
  - tests/benchmark/test_pg_scale.py::test_b10_partitioned_list_and_filter_p99
  notes: "Corrected in M6: struck tsvector search and search p99 < 1 s because no search capability exists\
    \ in shipped code (no tsvector column/index, no q parameter in Appendix D.2). Section 10 view 4 History\
    \ full-text search is an unbuilt Phase-2 feature, not a shipped-milestone promise \u2014 \xA714.4\
    \ correcting-vs-gaming outcome 3. B10 now measures two shapes through dashboard_api.services.list_investigations:\
    \ cursor page and filtered history query, both p99 < 200 ms, over 12 monthly partitions at 100k investigations\
    \ and 5M llm_calls/audit_log rows."
- id: B11
  description: audit_log + llm_calls insert throughput (every action writes audit)
  threshold: '>= 1000 inserts/s combined without partition-routing degradation'
  owning_milestone: M6
  status: covered
  tests:
  - tests/benchmark/test_pg_scale.py::test_b11_audit_llm_insert_throughput
  tier: on-demand
  notes: |
    M6 measured the scale-shaped >=1000 inserts/s bar through the real write_audit +
    PGTraceStore.insert_llm_call against the shared seeded 12-partition fixture
    (tests/benchmark/test_pg_scale.py::test_b11_audit_llm_insert_throughput).
    Writer model: seven concurrent writer process instances (four services in the
    default single-replica deployment: ingest-gateway x4, dashboard-api, probe-gateway,
    temporal-worker), each with an independent unwidened engine at make_engine defaults,
    stock durability. The input to the topology derivation moved with FP-IG-20
    (ingest-gateway is four processes); writers is the derived sum, not a tuning knob.
    Combined means the two tables. M1 test_audit.py still covers unit-level write_audit
    correctness. The 1000/s figure is derived from B1 rather than from this entry: B1 requires
    the ingest front door to sustain a 5x burst of 200 req/s for 30 s with 0
    errors, and services/gateway/gateway/ingest.py writes exactly one audit_log row
    per ingested alert on four mutually exclusive branches (event_merged:252,
    event_received:287, event_rejected:320; one reference per action, the
    representative first occurrence). GC-2 leaves that one-row-per-alert
    accounting unchanged while moving the committed-existing-case merge into
    the fused statement merge_existing_event_with_audit, which writes its
    event_merged row itself; the under-lock merge, open and reject branches
    still call write_audit, and the representative above is the remaining
    real under-lock write_audit call. B11 measures the audit-table insert
    station, not the whole HTTP merge transaction: B1, not B11, gates the
    fused ingest shape. So the storage tier absorbs 1000 audit
    inserts/s at that burst. The recorded ~995/s was measured under the four-writer
    model and is not comparable with any seven-writer figure (section 14.4 rule 3).
    The first seven-writer reference measurement is read by the existing B11 branch
    pair; this pass does not re-measure or re-derive the threshold.
    bench-on-demand (design/slices/bench-on-demand/design.md, recorded in
    design/frozen-deviations.md) moved this benchmark out of the CI benchmark job.
    `tier: on-demand` is where it runs: the same node id, with the same bar and the same
    seven-writer model, on a developer host, before every `v*` tag and after a change to the
    ingest write path. The bar itself is unchanged and unweakened -- a combined rate below
    1000.0 is an assertion failure with its existing rate message and nothing after it. There
    is no failure classification, no I/O-full stall suffix, no retry, no rerun, no skip, no
    xfail, no continue-on-error and no exit-code masking. The entry is not deferred and the
    node carries no skip decorator; the departure from CI is the deleted step. A recorded rate
    below 1000.0, or a writer count other than 7, refuses a `v*` tag through
    scripts/check_release_bench_record.py. The benchmark
    prints a B11 env=cpus=...,serial_commit_ms=...,combined_over_single=...
    fingerprint alongside the writer count, the writer map and the single-writer
    rate, so a storage-class difference and a compute difference between two hosts
    are distinguishable from a log. The benchmark additionally prints one
    canonical B11 diagnostics= record on a pass and before a threshold
    failure: 21 comma-delimited fields in one fixed order -- the combined
    rate, the two existing commit/concurrency fingerprints, one
    elapsed-milliseconds and committed-row entry per declared writer
    instance (plus-joined, so no writer entry can forge a field boundary),
    aggregate host steal and the six cpu/io/memory PSI some+full totals
    over the same measured window, and the storage identity at
    PostgreSQL's own data_directory. The storage view is read
    unprivileged inside the running PostgreSQL container -- that
    container's own mount record plus the read-only block sysfs
    attributes it exposes -- and never from the pytest process's
    filesystem, a Docker volume class or a host backing path; it is
    resolved before engine and row warmup, so no diagnostic read touches
    the measured window. Free-form values are percent-encoded, each field
    falls back independently to the literal unavailable, and every one of
    the 21 fields is reported-only: none conditions the threshold, the writer
    model, the pool, durability, a retry or a skip, and none appears in the
    assertion's condition or changes its message. The whole line is copied into the
    release record so an on-demand run keeps its PSI numbers there; there is no second
    ledger of them.
  concurrency_model:
    writers: 7
    pool: per-writer-independent
    pool_widening: none
    durability: stock
    writer_processes:
      - process: ingest-gateway
        processes: 4
        tables: [audit_log]
        call_sites:
          - file: services/gateway/gateway/ingest.py
            line: 252
            in: IngestService._ingest_txn
            symbol: write_audit
            expr: "write_audit("
      - process: dashboard-api
        processes: 1
        tables: [audit_log]
        call_sites:
          - file: services/dashboard-api/dashboard_api/services.py
            line: 470
            in: decide_approval_atomic
            symbol: write_audit
            expr: "write_audit("
      - process: probe-gateway
        processes: 1
        tables: [audit_log]
        call_sites:
          - file: services/probe-gateway/internal/gwserver/server.go
            line: 507
            in: (*Server).emitCredentialAudits
            symbol: Write
            expr: "audit.Write(ctx, s.AuditDB,"
      - process: temporal-worker
        processes: 1
        tables: [audit_log, llm_calls]
        call_sites:
          - file: services/worker/worker/activities/investigation.py
            line: 147
            in: InvestigationActivities.create_case
            symbol: write_audit
            expr: "write_audit("
          - file: libs/py/rca_common/rca_common/llmclient/client.py
            line: 168
            in: LLMClient.generate
            symbol: insert_llm_call
            expr: "self._trace_store.insert_llm_call(record)"
            via:
              file: services/worker/worker/activities/investigation.py
              line: 246
              in: InvestigationActivities._plan
              symbol: generate
              expr: "await self._llm.generate("
- id: B12
  description: Dashboard hot endpoints (GET /investigations, /approvals?pending, /metrics/summary) under
    50 concurrent users
  threshold: p99 < 300 ms
  owning_milestone: M4
  status: covered
  tests:
  - services/dashboard-api/tests/test_b12_hot_endpoints.py::test_b12_dashboard_hot_endpoints_p99_under_300ms
  notes: In-process ASGI micro-benchmark against ephemeral Postgres with 50 concurrent users x 3 hot endpoints;
    asserts p99 < 300 ms.
- id: B13
