schema_version: 1
benchmarks:
- id: B1
  description: 'Ingest webhook under declared CPU affinities: CI-scale merge gate plus four-measured-role-exclusive-core
    product record'
  threshold: 'CI-scale gating: >= 450 req/s served, p99 < 150 ms, 0 errors at 500 req/s offered for
    30s with exclusive gateway/PG/driver affinity cardinalities=2/1/1; product recorded, non-gating:
    served == offered, p99 < 150 ms, 0 errors at 1000 req/s offered for 30s with 4 gateway CPUs
    exclusive from PG/driver'
  owning_milestone: M3
  status: covered
  tests:
  - services/gateway/tests/test_hmac_auth.py::test_b1_hmac_normalize_fingerprint_hot_path
  - tests/e2e/test_e2e_load.py::test_b1_ingest_burst_profile
  - services/gateway/tests/test_b1_ingest_burst.py::test_b1_ci_scale_reference_profile
  - services/gateway/tests/test_b1_ingest_burst.py::test_b1_product_exclusive_reference_profile
  notes: |
    Two tiers over one shipped ingest path and one classifier. CI-scale gates in both CI and local
    `scripts/integration-test.sh b1` on the same numbers.
    The product tier is recorded, non-gating; reason: host-dependent, not in CI.
    The allocation mechanism is scheduler affinity (sched_setaffinity/taskset), not a CFS bandwidth
    quota and not a Docker cpuset: each measured role gets an exact, pairwise-disjoint set of logical
    CPUs, read back from /proc/<pid>/status Cpus_allowed_list and os.sched_getaffinity at window open
    and again at window close. Effective cpu.max, cpu.stat throttling counters, gateway CPU use and
    host-busy values are recorded as reported diagnostics only and decide nothing; an unreadable
    source is serialized as `unavailable` rather than as a zero.
    CI-scale allocation, decided per exact CPU model (design/slices/gc-3-reference-topology):
    the reference set is the first two complete SMT sibling pairs available to the launcher on the
    four-vCPU ubuntu-latest reference host, and the role mapping over those two pairs is the
    topology one exact `cpuModel` earned from two complete same-head discovery artifacts through
    the tracked carrier tests/benchmark/b1_topology_decision.json (schema 2, keyed by exact
    cpuModel). Per-model decision table at this revision, every entry decided from two complete
    28-arm discovery artifacts of its own exact model at head
    51e8a3175a4c247ab6afa47a5588bcbb96fafa99, produced by the manual sweep
    `scripts/integration-test.sh b1_topology_probe`:
    `AMD EPYC 7763 64-Core Processor` -- status unhostable; no topology, no role cardinality and
    no placement schema are claimed for it; it is recorded, non-gating, under reason
    `topology_unratified_sku:AMD EPYC 7763 64-Core Processor`, and starts no live CI-scale
    workload; discovery evidence https://github.com/yabinma/dbagent/actions/runs/35184858860
    and https://github.com/yabinma/dbagent/actions/runs/35186707903.
    `AMD EPYC 9V74 80-Core Processor` -- status unhostable; no topology, no role cardinality and
    no placement schema are claimed for it; it is recorded, non-gating, under reason
    `topology_unratified_sku:AMD EPYC 9V74 80-Core Processor`, and starts no live CI-scale
    workload; discovery evidence https://github.com/yabinma/dbagent/actions/runs/35184851198
    and https://github.com/yabinma/dbagent/actions/runs/35186725808.
    No row in this revision is `selected`: in each of those two pairs, no topology class met
    every unchanged CI-scale comparison in all eight of its records, so no class is ratifiable
    for either model. Those are two per-model negative results against the unchanged bar below,
    which is neither weakened nor re-derived by them, and they claim nothing about any other
    exact model. A `selected` row names its topology id, its topology-derived
    gateway/PostgreSQL/driver cardinalities, its physical relationship over the two pairs, its
    all-role sibling witness, placement schema 3, the two discovery evidence URLs and its final
    gating run; an `unhostable` row names no topology and no cardinality and cites
    `topology_unratified_sku:<model>`. A valid exact model that is absent from the table follows
    that same recorded, non-gating policy under the same reason; a model whose string cannot be
    read or is outside the closed model-string rules records
    `topology_cpu_model_unavailable`. Both recorded routes run the unconditional container-free
    coverage phase first, start no live workload afterwards, and are not a pytest skip and not a
    green benchmark. A missing or corrupt carrier is neither: it fails the target with
    `gc3_decision_missing` or `gc3_decision_invalid`. CI-scale profile:
    open-loop 500 req/s offered for 30 s = 15000 offered requests, due-time latency,
    MAX_IN_FLIGHT=500, unmeasured prologue, no environment knob; it asserts placement_ok=1,
    offered==15000, served+errors==offered, errors==0, served==offered, due-time p99<150ms,
    committed==served, served_rate>=CI_SCALE_SUSTAINED_FLOOR=450 and platform ONLINE, through the
    reference tier test
    services/gateway/tests/test_b1_ingest_burst.py::test_b1_ci_scale_reference_profile.
    Rate derivation, fixed at design time: 3.034 ms/served request on the contended reference host in
    CI run 34965890902; 500 x 0.003034 = 1.517 CPU on two exclusive gateway CPUs is 75.85% utilization;
    the 80% ceiling is 0.80 x 2.00 / 0.003034 = 527.36 req/s, rounded down to the next 100 for the
    500 req/s offer, with one further fixed 50 req/s finite-window margin giving the 450 req/s
    served-rate floor.
    Product allocation: the first eight CPUs available to the launcher, split 4/3/1, so the gateway
    holds four logical CPUs exclusive of the PostgreSQL and driver sets. Product profile: open-loop
    1000 req/s offered for 30 s = 30000 offered requests, MAX_IN_FLIGHT=1000, run only through local
    `scripts/integration-test.sh b1_product` on a host with at least eight available logical CPUs, via
    services/gateway/tests/test_b1_ingest_burst.py::test_b1_product_exclusive_reference_profile. Its
    three product comparisons errors==0, p99<150ms and served==offered are serialized on the B1
    fingerprint as met/missed and do not fail that target or the composite `all` route; its exact
    pairwise-disjoint placement witness, accounting identities served+errors==offered and
    committed==served, record integrity, the nonbinding MAX_IN_FLIGHT outer gate and
    served_rate>=SUSTAINED_FLOOR=200 all stay failure-producing.
    The product tier is absent from CI because a public-repository standard runner has
    four total vCPUs, and no larger, self-hosted or paid runner class is available on this account.
    This entry is covered through its gating CI-scale tier; the product link is not reclassified as a
    gating threshold by that status.
    In-process micro-benchmark of the HMAC verify + normalize + fingerprint hot path:
    services/gateway/tests/test_hmac_auth.py.
    The kind e2e link tests/e2e/test_e2e_load.py::test_b1_ingest_burst_profile stays a nested
    functional/deployment test under its current resource model, exercising the sustained profile
    (open-loop baseline at 200 req/s) and a closed-loop saturation phase against the shipped image and
    chart with real kubelet probes, asserting completion/p99/accounting and 0 restarts / no Unhealthy
    events; three bare-container affinities neither bound nor describe that topology, so it implements
    neither reference declaration and refutes neither, a green nested run is a sufficient
    demonstration and a red one is not a refutation.
    max_lateness_ms is a reported diagnostic rather than a bar, and beyond the floor a finite-window
    burst certifies no sustained served-rate figure near the offered rate. Serving shape is uvicorn
    workers=4 (DBAGENT_GATEWAY_WORKERS / ingestGateway.workers); no shipped gateway configuration
    value moves for either tier.
    The ingestGateway sizing basis cpuMsPerRequest=2.427 and its empty observations ledger are
    unchanged and are owned by the B1-LATENCY-BASIS-1 slice, which must collect five consecutive
    placement-valid CI-scale runs at one collection head before any ledger row, CPU request or CPU
    limit changes; no run of either tier here is admitted as a sizing observation.
    Both tiers and the derivation are specified by
    design/slices/gc-1-reference-topology/design.md and recorded in design/frozen-deviations.md;
    the per-exact-cpuModel CI-scale topology decision and its recorded routes are specified by
    design/slices/gc-3-reference-topology/design.md.
    GC-4 (gateway PostgreSQL plan reuse) appends six cost fields to both B1 fingerprint lines, after
    the two lateness-leg fields and never before a gating one: postgres_cpu_us_per_req is
    measured-window PostgreSQL CPU microseconds per served request, and postgres_wait_scheduled,
    postgres_wait_completed, postgres_wait_failed, postgres_wait_observations and
    postgres_wait_events_pct describe a test-only 50 ms sampler of non-idle client backends over the
    same window. Each is a reported diagnostic in the same sense as max_lateness_ms: none is a bar,
    a recorded verdict, a topology-selector input or a sizing observation, and a missing reading is
    serialized as `unavailable` rather than as a zero. The per-exact-cpuModel decision table above is
    evidence for the product head it was measured at and for no other. GC-4 changed
    the fused statement's plan+execute cost per merge
    and nothing else: not this profile, not any bar, not any capacity or durability setting, and not
    any recorded entry, so every entry remains head-specific and awaits a separately audited GC-3
    requalification. That requalification supersedes a model's entry only from
    two complete distinct-run artifacts of that exact model
    at the shipped GC-4 head
    and re-derives the entry through the same selector; manual editing is not an allowed shortcut.
    Until it publishes a recomputed entry no model is selected, GC-4 claims no SKU and no p99 result,
    and the unchanged CI-scale bar stated above remains the only thing that can establish one.
- id: B2
  description: Fingerprint correlation query against alert_events with 1M rows (dedup index)
  threshold: p99 < 20 ms
  owning_milestone: M6
  status: covered
  tests:
  - tests/benchmark/test_pg_scale.py::test_b2_fingerprint_correlation_p99_under_20ms
  notes: "M6 measured p99 < 20 ms for rca_common.investigation_repo.find_open_by_fingerprint against a\
    \ 1 000 000-row alert_events table (not partitioned \u2014 \xA74.3 has no range partition on alert_events)\
    \ using the (fingerprint, received_at) index, via tests/benchmark/test_pg_scale.py::test_b2_fingerprint_correlation_p99_under_20ms. The terminal-heavy shape's cost model is pinned by FP-IG-17's named functional test."
- id: B3
  description: 'probe-gateway: 100 concurrent probe sessions, heartbeats + task dispatch (connection fan-in)'
  threshold: dispatch p99 < 50 ms, no heartbeat misses
  owning_milestone: M2
  status: covered
  tests:
  - services/probe-gateway/internal/gwserver/bench_test.go::TestB3_ProbeGateway_100ConcurrentSessions_DispatchP99
  notes: 'Implemented as a deterministic pass/fail Test (not a `go test -bench` Benchmark) since Section
    14.4''s bar is a concrete threshold ("pass = threshold met"), which a regular assertion expresses
    more directly than an open-ended `b.N` loop: 100 fake probes connect concurrently via real bufconn
    gRPC sessions and register against a real gwserver.Server, then send heartbeats continuously while
    one task is dispatched to each probe concurrently; the test measures and asserts p99 dispatch latency
    and heartbeat send-failure count against the threshold. Measured p99 on this dev machine: consistently
    under 5ms (well within the 50ms budget) across repeated runs incl. under -race. Not yet covered: the
    same workload against a real network listener (mTLS, not bufconn) or a real Postgres registry (this
    test uses registry.Fake) -- the in-process bufconn/Fake combination isolates probe-gateway''s own
    dispatch/fan-in overhead specifically, matching B3''s stated target ("connection fan-in"), without
    conflating it with network or database latency.

    '
- id: B4
  description: 'Chunked result streaming: 1 MiB payload in 256 KiB chunks, 50 concurrent tasks (evidence
    transfer)'
  threshold: end-to-end p99 < 2 s, reassembly CPU < 1 core
  owning_milestone: M2
  status: covered
  tests:
  - services/probe-gateway/internal/gwserver/bench_chunking_test.go::TestB4_ChunkedResultStreaming_50ConcurrentTasks_EndToEndP99
  notes: 'v1.5 manifest-honesty fix (review.md W2): B4''s hot path (probe/internal/sessionclient.ChunkPayload
    on the probe side, gwserver.reassembleChunks/receiveChunk on the gateway side) shipped in M2, so this
    had to stop being `deferred`. 50 fake probes register concurrently, each answers one Dispatch with
    a real 1 MiB payload split into 256 KiB chunks (4 chunks/probe) sent over the real gwserver.Server
    chunk-reassembly path (same bufconn technique as B3); the test asserts byte-for-byte reassembly correctness
    plus the end-to-end p99 threshold, and separately isolates "reassembly CPU < 1 core" by calling the
    real (unexported) reassembleChunks directly over 50 x 1 MiB payloads sequentially (see the test file''s
    own doc comment for why this is measured separately from the concurrent end-to-end latency: attributing
    the whole concurrent test''s network/goroutine-scheduling CPU to "reassembly" would conflate two different
    things and produce a meaningless number on a multi-core runner). Measured on this dev machine: end-to-end
    p99 ~45ms (plain) / ~353ms (under -race, still well within the 2s budget), reassembleChunks CPU ~0.05s
    (plain) / ~0.16s (under -race) for 50 x 1 MiB, both comfortably under the 1 core-second budget.

    '
- id: B5
  description: Redaction filter over a 1 MiB config payload (runs on every config read)
  threshold: < 100 ms
  owning_milestone: M2
  status: covered
  tests:
  - probe/internal/redact/bench_test.go::TestB5_Redaction_1MiBConfigPayload
  - probe/internal/redact/bench_test.go::TestB5_Redaction_1MiBStructuredPayload
  notes: 'v1.5 manifest-honesty fix (review.md W2): probe/internal/redact shipped in M2 and runs on every
    presto_config/presto_session_properties read (Section 8.2/8.5), so this had to stop being `deferred`.
    Two tests: a ~1 MiB Presto-*.properties-shaped text blob (Text(), a realistic mix of key-based and
    value-based-only credential lines) and a ~1 MiB structured payload (Map(), the recursive presto_session_properties-shaped
    case). Measured on this dev machine: ~65ms / ~35ms respectively, both comfortably under the 100ms
    budget. Excluded from `-race` builds (`//go:build !race` in the test file) -- this is a CPU-bound,
    allocation-heavy regex workload, and the race detector''s per-access instrumentation inflates its
    wall time by roughly an order of magnitude (measured >1.4s under -race for the same workload), which
    is not representative of the production latency the threshold is about; `go test ./...` (no -race)
    still enforces the real threshold. Also required a perf fix in probe/internal/redact/redact.go itself
    (cheap strings.Contains/EqualFold pre-checks before invoking the regexp engine, since the v1.5 value-based-scanning
    requirement (W3) would otherwise run two regexes over every single config line/value unconditionally)
    to comfortably clear the 100ms budget.

    '
