schema_version: 1
benchmarks:
- id: B1
  description: 'Ingest webhook under declared CPU affinities: the four-measured-role-exclusive-core
    product run, measured on demand'
  threshold: 'product on-demand: served == offered and 0 errors at 1000 req/s offered for 30s on the
    product-exclusive placement (gateway 4, PostgreSQL 3, driver 1), each role''s CPU set exclusive of
    the others; p99 < 150 ms is printed as met or missed and is not the bar'
  owning_milestone: M3
  status: covered
  tier: on-demand
  tests:
  - services/gateway/tests/test_hmac_auth.py::test_b1_hmac_normalize_fingerprint_hot_path
  - services/gateway/tests/test_b1_ingest_burst.py::test_b1_product_exclusive_reference_profile
  notes: |
    One shipped ingest path and one classifier, measured on demand rather than on every push.
    bench-on-demand (design/slices/bench-on-demand/design.md, recorded in
    design/frozen-deviations.md) removed B1 from the CI benchmark job together with the CI-scale
    route, its per-exact-cpuModel topology carrier, the recorded non-gating route and the manual
    CPU-basis oracle. `tier: on-demand` is where it runs now: the product profile, on a developer
    host, through local `scripts/integration-test.sh b1_product`, before every `v*` tag and after a
    change to the ingest write path. No CI job runs the live node; the guards that keep it out of CI
    and keep its bar honest run in the functional job. It is not deferred, not skipped and not xfailed
    -- the departure from CI is the deleted steps.
    The allocation mechanism is scheduler affinity (sched_setaffinity/taskset), not a CFS bandwidth
    quota and not a Docker cpuset: each measured role gets an exact, pairwise-disjoint set of logical
    CPUs, read back from /proc/<pid>/status Cpus_allowed_list and os.sched_getaffinity at window open
    and again at window close. Effective cpu.max, cpu.stat throttling counters, gateway CPU use and
    host-busy values are recorded as reported diagnostics only and decide nothing; an unreadable
    source is serialized as `unavailable` rather than as a zero.
    Product allocation: the first eight CPUs available to the launcher, split 4/3/1, so the gateway
    holds four logical CPUs exclusive of the PostgreSQL and driver sets. Product profile: open-loop
    1000 req/s offered for 30 s = 30000 offered requests, MAX_IN_FLIGHT=1000, run only through local
    `scripts/integration-test.sh b1_product` on a host with at least eight available logical CPUs, via
    services/gateway/tests/test_b1_ingest_burst.py::test_b1_product_exclusive_reference_profile.
    That node FAILS THE RUN on errors != 0 and on served != offered, and on its exact
    pairwise-disjoint placement witness, the accounting identities served+errors==offered and
    committed==served, record integrity, the nonbinding MAX_IN_FLIGHT outer gate and
    served_rate>=SUSTAINED_FLOOR=200. The three product comparisons errors==0, p99<150ms and
    served==offered are still serialized on the B1 fingerprint as met/missed; the first and third are
    met on any passing run because the two equalities above already decide it, and the p99 token is
    RECORDED ONLY -- no node asserts that it is met, and `product_p99_lt_150_ms=missed` does not fail
    the run and does not refuse a release.
    The product tier is absent from CI because a public-repository standard runner has
    four total vCPUs, and no larger, self-hosted or paid runner class is available on this account.
    In-process micro-benchmark of the HMAC verify + normalize + fingerprint hot path:
    services/gateway/tests/test_hmac_auth.py. That link is a code-level unit benchmark and stays in
    the unit-gateway job; `tier: on-demand` does not move it out of CI.
    The kind e2e path tests/e2e/test_e2e_load.py::test_b1_ingest_burst_profile is deliberately not
    one of the threshold-bearing links above; it stays a nested functional/deployment test
    under its current resource model, exercising the sustained profile (open-loop baseline at
    200 req/s) and a closed-loop saturation phase against the shipped image and chart with real
    kubelet probes, asserting completion/accounting and 0 restarts / no Unhealthy events; three
    bare-container affinities neither bound nor describe that topology, so it implements neither
    reference declaration and refutes neither, a green nested run is a sufficient demonstration and
    a red one is not a refutation. Eleven kind comparisons fail the e2e job: platform ONLINE;
    baseline served+errors==6000, errors==0, served==6000 and committed==served; saturation
    sat_served+sat_errors==issued, sat_errors==0, gateway restart delta ==0, Unhealthy event count
    ==0, sat_committed==sat_served, and the exact admissible audit-action tuple. The nested kind p99
    is no longer measured, recorded or uploaded at all. This changes no kind deployment resource:
    the chart, the e2e values overlay and every pod request/limit are untouched and undecided here.
    max_lateness_ms is a reported diagnostic rather than a bar, and beyond the floor a finite-window
    burst certifies no sustained served-rate figure near the offered rate. Serving shape is uvicorn
    workers=4 (DBAGENT_GATEWAY_WORKERS / ingestGateway.workers); no shipped gateway configuration
    value moves.
    The ingestGateway sizing basis and the chart CPU request/limit derived from it are owned by
    the B1-LATENCY-BASIS-1 slice, and that ledger is now HISTORY.
    ingestGateway.sizingBasis.cpuMsPerRequest is 1.585 ms per request: max + (max - min) over
    exactly the five recorded observation costs 1.445, 1.488, 1.475, 1.414 and 1.391, from which
    the chart renders requests.cpu = ceil(1.585 x 200) = 317m and limits.cpu = 5 x 317 = 1585m.
    ingestGateway.sizingBasis.observations carries those five recorded historical observations and
    collection.attempts the eleven dispatches from the first through the fifth accepted one, each
    either linked one-to-one to its observation or discarded with its exact recorded reason. Nothing
    re-derives those figures: the live requalifying CPU-basis oracle is deleted with the CI-scale
    operating point it was computed at, and a product-profile sample at 1000 req/s on eight CPUs is
    a different claim, so it is evidence neither for nor against 1.585.
    tests/delivery/test_delivery_sizing_ledger.py::test_sizing_basis_provenance_is_on_reference_and_from_a_serving_run
    remains the single actual-state owner of that ledger and of the void it replaced, it stays a CI
    benchmark-job step, and it is what still fails a silent edit of 1.585 or of 317m/1585m.
    Both the product profile and the derivation are specified by
    design/slices/gc-1-reference-topology/design.md, the sizing warrant by
    design/slices/b1-latency-basis-1/design.md, and every superseding decision above is recorded in
    design/frozen-deviations.md.
    GC-4 (gateway PostgreSQL plan reuse) appends six cost fields to the B1 fingerprint line, after
    the two lateness-leg fields and never before a gating one: postgres_cpu_us_per_req is
    measured-window PostgreSQL CPU microseconds per served request, and postgres_wait_scheduled,
    postgres_wait_completed, postgres_wait_failed, postgres_wait_observations and
    postgres_wait_events_pct describe a test-only 50 ms sampler of non-idle client backends over the
    same window. Each is a reported diagnostic in the same sense as max_lateness_ms: none is a bar,
    a recorded verdict or a sizing observation, and a missing reading is serialized as `unavailable`
    rather than as a zero. GC-4 changed
    the fused statement's plan+execute cost per merge
    and nothing else: not this profile, not any bar, not any capacity or durability setting, and not
    any recorded entry.
    GC-5 (durable commit shape) appends eight further reported fields to the B1 fingerprint line,
    immediately after those six and still never before a gating one: postgres_xact_commit_delta,
    postgres_xact_rollback_delta, postgres_xact_commits_per_served, postgres_wal_records_delta,
    postgres_wal_bytes_delta, postgres_wal_write_delta, postgres_wal_sync_delta and
    postgres_wal_syncs_per_served, read for the measured database from pg_stat_database and
    pg_stat_wal through a connection to a separate maintenance database so the reader's own
    transactions cannot enter the counter it reports; an unusable observation serializes
    `unavailable` in all eight rather than a zero. GC-5's claim is transaction frequency and nothing
    else: committed database transactions per served request on the product-local route,
    which its own node
    services/gateway/tests/test_b1_ingest_burst.py::test_gc5_commit_shape_reference_profile
    requires to be at most 0.60. That node consumes no other quantity; CPU per request, max in
    flight, p99, the three lateness legs, the wait histogram and the WAL deltas stay reported
    diagnostics in the same sense as max_lateness_ms. GC-5 changed
    how many ingested events share one durable commit
    and nothing else: not this profile, not the product bar above, not MAX_IN_FLIGHT, workers,
    limit_concurrency, the pools, the schema, the durability settings or the sizing basis.
    B1-HOST-NOISE (host noise) appends ten further reported fields to the B1 fingerprint line,
    immediately after those eight and still never before a gating one: host_steal_usec,
    assigned_cpu_steal_usec, host_psi_cpu_some_usec, host_psi_cpu_full_usec, host_psi_io_some_usec,
    host_psi_io_full_usec, host_psi_memory_some_usec, host_psi_memory_full_usec,
    assigned_cpu_freq_open_khz and assigned_cpu_freq_close_khz. The driver container reads them at
    the two measured-window boundaries -- the opening read is the last work before the clock
    starts, the closing read the first work after the window drains -- from three declared
    kernel-global sources and nothing else: the steal column of /proc/stat, the `some` and `full`
    total= counters of /proc/pressure, and /sys/devices/system/cpu/cpu<N>/cpufreq/scaling_cur_freq
    for the union of the gateway and PostgreSQL affinity sets. Steal and PSI are non-negative
    open-to-close deltas in microseconds; the two frequency maps are instantaneous kHz readings,
    one per boundary. Every scalar is a base-10 integer and every per-CPU map is
    `id:value+id:value` sorted by numeric CPU id, so no value carries a raw comma. A missing,
    malformed, incomplete, reset or unreadable source serializes the whole affected field as
    `unavailable` -- never a zero and never a partial map -- and names the reason in a
    `B1 diagnostic unavailable:` note; a host without a cpufreq directory therefore reports both
    frequency maps as `unavailable`, which is data rather than a failure. The block is append-only:
    every pre-slice fingerprint stays valid unedited and no exact field count is enforced anywhere.
    All ten are reported diagnostics in the same sense as max_lateness_ms. None is a bar,
    a recorded verdict, a qualifying-run predicate, a CPU-basis operand or
    a sizing observation; no node compares one, no run is retried, skipped or exempted because of
    one, and the product bar stated above still decides every run by itself. No CI job requires a
    live observation of them. B1-HOST-NOISE changed
    what the fingerprint reports about host conditions during the window
    and nothing else: not this profile, not the product bar above, not MAX_IN_FLIGHT, workers,
    limit_concurrency, the pools, the schema, the durability settings, the GC-5 commit shape or the
    sizing basis. It explains no result, predicts no result and claims no p99 outcome, and
    observes neither a governor trace, a thermal reading, noisy-neighbour identity nor
    guest-invisible SMT contention.
- id: B2
  description: Fingerprint correlation query against alert_events with 1M rows (dedup index)
  threshold: p99 < 20 ms
  owning_milestone: M6
  status: covered
  tests:
  - tests/benchmark/test_pg_scale.py::test_b2_fingerprint_correlation_p99_under_20ms
  notes: "M6 measured p99 < 20 ms for rca_common.investigation_repo.find_open_by_fingerprint against a\
    \ 1 000 000-row alert_events table (not partitioned \u2014 \xA74.3 has no range partition on alert_events)\
    \ using the (fingerprint, received_at) index, via tests/benchmark/test_pg_scale.py::test_b2_fingerprint_correlation_p99_under_20ms. The terminal-heavy shape's cost model is pinned by FP-IG-17's named functional test."
- id: B3
  description: 'probe-gateway: 100 concurrent probe sessions, heartbeats + task dispatch (connection fan-in)'
  threshold: dispatch p99 < 50 ms, no heartbeat misses
  owning_milestone: M2
  status: covered
  tests:
  - services/probe-gateway/internal/gwserver/bench_test.go::TestB3_ProbeGateway_100ConcurrentSessions_DispatchP99
  notes: 'Implemented as a deterministic pass/fail Test (not a `go test -bench` Benchmark) since Section
    14.4''s bar is a concrete threshold ("pass = threshold met"), which a regular assertion expresses
    more directly than an open-ended `b.N` loop: 100 fake probes connect concurrently via real bufconn
    gRPC sessions and register against a real gwserver.Server, then send heartbeats continuously while
    one task is dispatched to each probe concurrently; the test measures and asserts p99 dispatch latency
    and heartbeat send-failure count against the threshold. Measured p99 on this dev machine: consistently
    under 5ms (well within the 50ms budget) across repeated runs incl. under -race. Not yet covered: the
    same workload against a real network listener (mTLS, not bufconn) or a real Postgres registry (this
    test uses registry.Fake) -- the in-process bufconn/Fake combination isolates probe-gateway''s own
    dispatch/fan-in overhead specifically, matching B3''s stated target ("connection fan-in"), without
    conflating it with network or database latency.

    '
- id: B4
  description: 'Chunked result streaming: 1 MiB payload in 256 KiB chunks, 50 concurrent tasks (evidence
    transfer)'
  threshold: end-to-end p99 < 2 s, reassembly CPU < 1 core
  owning_milestone: M2
  status: covered
  tests:
  - services/probe-gateway/internal/gwserver/bench_chunking_test.go::TestB4_ChunkedResultStreaming_50ConcurrentTasks_EndToEndP99
  notes: 'v1.5 manifest-honesty fix (review.md W2): B4''s hot path (probe/internal/sessionclient.ChunkPayload
    on the probe side, gwserver.reassembleChunks/receiveChunk on the gateway side) shipped in M2, so this
    had to stop being `deferred`. 50 fake probes register concurrently, each answers one Dispatch with
    a real 1 MiB payload split into 256 KiB chunks (4 chunks/probe) sent over the real gwserver.Server
    chunk-reassembly path (same bufconn technique as B3); the test asserts byte-for-byte reassembly correctness
    plus the end-to-end p99 threshold, and separately isolates "reassembly CPU < 1 core" by calling the
    real (unexported) reassembleChunks directly over 50 x 1 MiB payloads sequentially (see the test file''s
    own doc comment for why this is measured separately from the concurrent end-to-end latency: attributing
    the whole concurrent test''s network/goroutine-scheduling CPU to "reassembly" would conflate two different
    things and produce a meaningless number on a multi-core runner). Measured on this dev machine: end-to-end
    p99 ~45ms (plain) / ~353ms (under -race, still well within the 2s budget), reassembleChunks CPU ~0.05s
    (plain) / ~0.16s (under -race) for 50 x 1 MiB, both comfortably under the 1 core-second budget.

    '
- id: B5
  description: Redaction filter over a 1 MiB config payload (runs on every config read)
  threshold: < 100 ms
  owning_milestone: M2
  status: covered
  tests:
  - probe/internal/redact/bench_test.go::TestB5_Redaction_1MiBConfigPayload
  - probe/internal/redact/bench_test.go::TestB5_Redaction_1MiBStructuredPayload
  notes: 'v1.5 manifest-honesty fix (review.md W2): probe/internal/redact shipped in M2 and runs on every
    presto_config/presto_session_properties read (Section 8.2/8.5), so this had to stop being `deferred`.
    Two tests: a ~1 MiB Presto-*.properties-shaped text blob (Text(), a realistic mix of key-based and
    value-based-only credential lines) and a ~1 MiB structured payload (Map(), the recursive presto_session_properties-shaped
    case). Measured on this dev machine: ~65ms / ~35ms respectively, both comfortably under the 100ms
    budget. Excluded from `-race` builds (`//go:build !race` in the test file) -- this is a CPU-bound,
    allocation-heavy regex workload, and the race detector''s per-access instrumentation inflates its
    wall time by roughly an order of magnitude (measured >1.4s under -race for the same workload), which
    is not representative of the production latency the threshold is about; `go test ./...` (no -race)
    still enforces the real threshold. Also required a perf fix in probe/internal/redact/redact.go itself
    (cheap strings.Contains/EqualFold pre-checks before invoking the regexp engine, since the v1.5 value-based-scanning
    requirement (W3) would otherwise run two regexes over every single config line/value unconditionally)
    to comfortably clear the 100ms budget.

    '
