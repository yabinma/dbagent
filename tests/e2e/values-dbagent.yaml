temporal:
  mode: dev
postgresql:
  bundled: true
minio:
  bundled: true
modelGateway:
  bundled: true
networkPolicy:
  enabled: false
secrets:
  create: true
  data:
    PG_DSN: "postgresql://dbagent:dbagent@dbagent-postgresql:5432/dbagent"
    S3_ACCESS_KEY: "minioadmin"
    S3_SECRET_KEY: "minioadmin"
    LITELLM_MASTER_KEY: "sk-e2e"
    DASHBOARD_JWT_SECRET: "e2e-jwt-secret"
    GRAFANA_WEBHOOK_SECRET: "e2e-hmac-secret"
    ADMIN_USERNAME: "admin"
    ADMIN_INITIAL_PASSWORD: "admin-e2e-password"
config:
  # In-cluster capture for E2 notification-payload redaction (FP-M6-17 / C4).
  # Worker POSTs to the Service DNS name; the e2e host reads NodePort 30084.
  notifications:
    outbound_webhooks:
      - name: e2e-capture
        url: "http://webhook-capture:8080/hook"
        format: generic
        events:
          - approval_requested
          - case_needs_human
          - case_resolved
          - case_rejected
        min_severity: low
  ingest:
    sources:
      - name: grafana
        secret: "${GRAFANA_WEBHOOK_SECRET}"
      - name: grafana-e2e
        secret: "${GRAFANA_WEBHOOK_SECRET}"
# NodePort surface matching tests/e2e/kind-cluster.yaml + conftest.py (§11.1.3).
ingestGateway:
  replicaCount: 1
  service:
    type: NodePort
    nodePort: 30080
dashboardApi:
  replicaCount: 1
  service:
    type: NodePort
    nodePort: 30081
probeGateway:
  replicaCount: 1
  service:
    type: NodePort
    nodePort: 30082
dashboardWeb:
  replicaCount: 1
  service:
    type: NodePort
    nodePort: 30083
