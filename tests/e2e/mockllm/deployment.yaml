# Test-only mock LLM provider for kind e2e (FP-M6-17). Not a product image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  labels:
    app: mock-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-llm
  template:
    metadata:
      labels:
        app: mock-llm
    spec:
      containers:
        - name: mock-llm
          image: rca-mockllm:e2e
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8090
          # Avoid BestEffort QoS: mock-llm backs model-gateway / investigations
          # and must not be first starved under node pressure on a 4-vCPU CI runner.
          resources:
            requests: { cpu: 50m, memory: 128Mi }
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  labels:
    app: mock-llm
spec:
  selector:
    app: mock-llm
  ports:
    - name: http
      port: 8090
      targetPort: http
