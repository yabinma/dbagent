# E4 runaway query → presto.kill_query (Section 13.6).
- when: {agent_role: planner}
  respond: planner.json
  repeat: all
- when: {agent_role: collector}
  respond: collector.json
  repeat: all
- when: {agent_role: rca}
  respond: rca.json
  repeat: all
- when: {agent_role: remediation}
  respond: remediation.json
  repeat: all
