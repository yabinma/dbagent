# Combined e2e fixture set for the in-cluster mock LLM (FP-M6-17).
# Discriminators are scenario-unique sentinels (labels.scenario) so
# first-match-wins ordering is not load-bearing. Generic single words
# (memory, catalog, queue, ...) appear in other scenarios' evidence and
# steal the wrong fixture (H-C).
# E1 worker OOM — MUST NOT set settle_seconds on adjust_memory_config (rev 2.4).
- when: {agent_role: planner, prompt_contains: "e1_oom"}
  respond: e1/planner.json
  repeat: all
- when: {agent_role: collector, prompt_contains: "e1_oom"}
  respond: e1/collector.json
  repeat: all
- when: {agent_role: rca, prompt_contains: "e1_oom"}
  respond: e1/rca.json
  repeat: all
- when: {agent_role: remediation, prompt_contains: "e1_oom"}
  respond: e1/remediation.json
  repeat: all
# E2 broken catalog / configuration
- when: {agent_role: planner, prompt_contains: "e2_catalog"}
  respond: e2/planner.json
  repeat: all
- when: {agent_role: collector, prompt_contains: "e2_catalog"}
  respond: e2/collector.json
  repeat: all
- when: {agent_role: rca, prompt_contains: "e2_catalog"}
  respond: e2/rca.json
  repeat: all
- when: {agent_role: remediation, prompt_contains: "e2_catalog"}
  respond: e2/remediation.json
  repeat: all
# E3 queue saturation → CLOSED_SUMMARY, no playbook
- when: {agent_role: planner, prompt_contains: "e3_queue"}
  respond: e3/planner.json
  repeat: all
- when: {agent_role: collector, prompt_contains: "e3_queue"}
  respond: e3/collector.json
  repeat: all
- when: {agent_role: rca, prompt_contains: "e3_queue"}
  respond: e3/rca.json
  repeat: all
- when: {agent_role: remediation, prompt_contains: "e3_queue"}
  respond: e3/remediation.json
  repeat: all
# E4 runaway query → kill_query
- when: {agent_role: planner, prompt_contains: "e4_runaway"}
  respond: e4/planner.json
  repeat: all
- when: {agent_role: collector, prompt_contains: "e4_runaway"}
  respond: e4/collector.json
  repeat: all
- when: {agent_role: rca, prompt_contains: "e4_runaway"}
  respond: e4/rca.json
  repeat: all
- when: {agent_role: remediation, prompt_contains: "e4_runaway"}
  respond: e4/remediation.json
  repeat: all
# Remediation backups: labels.scenario is in the alert (planner/rca) but
# the remediation prompt is the RCA report. Unique phrases from each
# scenario's rca.json carry the identity forward.
- when: {agent_role: remediation, prompt_contains: "undersized query.max-memory-per-node"}
  respond: e1/remediation.json
  repeat: all
- when: {agent_role: remediation, prompt_contains: "broken.properties has an invalid"}
  respond: e2/remediation.json
  repeat: all
- when: {agent_role: remediation, prompt_contains: "queued backlog"}
  respond: e3/remediation.json
  repeat: all
- when: {agent_role: remediation, prompt_contains: "runaway query should be killed"}
  respond: e4/remediation.json
  repeat: all
# Collector backups: `_summarize_evidence` renders only tool/args/payload
# (collector_summary.txt), never labels.scenario. Unique tool/args from
# each scenario's planner fixture; shared tools (presto_cluster_info,
# presto_list_queries) cannot discriminate and must not steal E1.
- when: {agent_role: collector, prompt_contains: "resource_usage"}
  respond: e1/collector.json
  repeat: all
- when: {agent_role: collector, prompt_contains: "catalog:broken"}
  respond: e2/collector.json
  repeat: all
- when: {agent_role: collector, prompt_contains: "presto_query_info"}
  respond: e4/collector.json
  repeat: all
# Fallbacks by agent_role so unknown prompts still progress. Collector
# fallback is scenario-neutral: an E1-shaped fallback recontaminates
# every later scenario's evidence (W1).
- when: {agent_role: planner}
  respond: e1/planner.json
  repeat: all
- when: {agent_role: collector}
  respond: default/collector.json
  repeat: all
- when: {agent_role: rca}
  respond: e1/rca.json
  repeat: all
- when: {agent_role: remediation}
  respond: e1/remediation.json
  repeat: all
