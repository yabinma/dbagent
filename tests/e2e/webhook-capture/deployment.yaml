# Test-only in-cluster notification capture (FP-M6-17 / E2).
# The control-plane worker POSTs outbound webhooks here; the e2e suite
# reads /received over the NodePort to assert redaction on real bytes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-capture
  labels:
    app: webhook-capture
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import json
    import threading

    _lock = threading.Lock()
    RECEIVED: list[dict] = []

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            n = int(self.headers.get("Content-Length") or 0)
            raw = self.rfile.read(n)
            entry = {
                "path": self.path,
                "body": raw.decode("utf-8", "replace"),
                "content_type": self.headers.get("Content-Type") or "",
            }
            with _lock:
                RECEIVED.append(entry)
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok")

        def do_GET(self):
            with _lock:
                payload = list(RECEIVED)
            if self.path.rstrip("/").endswith("reset"):
                with _lock:
                    RECEIVED.clear()
                payload = []
            body = json.dumps(payload).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *_args):
            return

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-capture
  labels:
    app: webhook-capture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-capture
  template:
    metadata:
      labels:
        app: webhook-capture
    spec:
      containers:
        - name: capture
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: script
          configMap:
            name: webhook-capture
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-capture
  labels:
    app: webhook-capture
spec:
  selector:
    app: webhook-capture
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30084
