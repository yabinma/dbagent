apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbagent-probe.fullname" . }}
  labels:
    {{- include "dbagent-probe.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: dbagent-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: dbagent-probe
    spec:
      serviceAccountName: {{ include "dbagent-probe.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: probe
          image: {{ printf "%s/%s:%s" .Values.image.registry .Values.image.name .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PROBE_CONFIG
              value: /etc/dbagent-probe/config.yaml
            - name: BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.bootstrapTokenExistingSecret }}{{ .Values.bootstrapTokenExistingSecret }}{{ else }}{{ include "dbagent-probe.fullname" . }}-bootstrap-token{{ end }}
                  key: BOOTSTRAP_TOKEN
          volumeMounts:
            - name: config
              mountPath: /etc/dbagent-probe
              readOnly: true
            - name: state
              mountPath: /var/lib/dbagent-probe
            {{- if .Values.platformCredentials.existingSecret }}
            - name: credentials
              mountPath: /etc/dbagent-probe/platform-credentials
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: {{ include "dbagent-probe.fullname" . }}-config
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "dbagent-probe.fullname" . }}-state
        {{- if .Values.platformCredentials.existingSecret }}
        - name: credentials
          secret:
            secretName: {{ .Values.platformCredentials.existingSecret }}
        {{- end }}
