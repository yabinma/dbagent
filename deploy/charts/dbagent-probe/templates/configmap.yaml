apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dbagent-probe.fullname" . }}-config
  labels:
    {{- include "dbagent-probe.labels" . | nindent 4 }}
data:
  config.yaml: |
    platform_key: {{ .Values.platformKey | quote }}
    gateway_address: {{ .Values.gatewayAddress | quote }}
    bootstrap_address: {{ .Values.bootstrapAddress | quote }}
    bootstrap_token: "${BOOTSTRAP_TOKEN}"
    bootstrap_ca_pin: {{ .Values.bootstrapCAPin | quote }}
    coordinator_locator: {{ .Values.coordinatorLocator | quote }}
    credentials_mount: /etc/dbagent-probe/platform-credentials
    write_enabled: {{ .Values.writeEnabled }}
    state_dir: /var/lib/dbagent-probe
    coordinator_port: {{ .Values.coordinatorPort }}
    coordinator_https: {{ .Values.coordinatorHTTPS }}
    namespace: {{ .Values.namespace | default .Release.Namespace | quote }}
