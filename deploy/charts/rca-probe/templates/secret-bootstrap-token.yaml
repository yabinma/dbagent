{{- if and .Values.bootstrapToken (not .Values.bootstrapTokenExistingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rca-probe.fullname" . }}-bootstrap-token
  labels:
    {{- include "rca-probe.labels" . | nindent 4 }}
type: Opaque
stringData:
  BOOTSTRAP_TOKEN: {{ .Values.bootstrapToken | quote }}
{{- end }}
