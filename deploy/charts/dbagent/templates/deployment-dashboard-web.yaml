apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbagent.fullname" . }}-dashboard-web
  labels:
    {{- include "dbagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard-web
spec:
  replicas: {{ .Values.dashboardWeb.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard-web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dashboard-web
    spec:
      securityContext:
        runAsNonRoot: true
        # nginxinc/nginx-unprivileged uses uid 101; named "nginx" fails
        # Kubernetes runAsNonRoot verification (needs numeric uid).
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: dashboard-web
          image: {{ include "dbagent.image" (dict "global" .Values.global "name" .Values.images.dashboardWeb) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DBAGENT_API_BASE_URL
              value: {{ .Values.dashboardWeb.apiBaseUrl | quote }}
            - name: DBAGENT_API_UPSTREAM
              value: {{ printf "http://%s-dashboard-api:8081/" (include "dbagent.fullname" .) | quote }}
          resources:
            {{- toYaml .Values.dashboardWeb.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 101
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbagent.fullname" . }}-dashboard-web
  labels:
    {{- include "dbagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard-web
spec:
  type: {{ .Values.dashboardWeb.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard-web
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- if and (eq (.Values.dashboardWeb.service.type | default "ClusterIP") "NodePort") .Values.dashboardWeb.service.nodePort }}
      nodePort: {{ .Values.dashboardWeb.service.nodePort }}
      {{- end }}
