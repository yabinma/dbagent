apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbagent.fullname" . }}-probe-gateway
  labels:
    {{- include "dbagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: probe-gateway
spec:
  replicas: {{ .Values.probeGateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: probe-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: probe-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: probe-gateway
          image: {{ include "dbagent.image" (dict "global" .Values.global "name" .Values.images.probeGateway) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: session
              containerPort: 8443
            - name: bootstrap
              containerPort: 8444
            - name: internal
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ include "dbagent.secretName" . }}
          env:
            - name: PROBE_GATEWAY_CONFIG
              value: /etc/dbagent/probe-gateway/config.yaml
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config
              mountPath: /etc/dbagent/probe-gateway
              readOnly: true
            - name: signing
              mountPath: /etc/dbagent/signing
              readOnly: true
            - name: bootstrap-ca
              mountPath: /etc/dbagent/probe-gateway-ca
          resources:
            {{- toYaml .Values.probeGateway.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: internal }
            initialDelaySeconds: 10
            {{- include "dbagent.probeTuning" .Values.probeGateway.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: internal }
            initialDelaySeconds: 5
            {{- include "dbagent.probeTuning" .Values.probeGateway.probes.readiness | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: {{ include "dbagent.fullname" . }}-probe-gateway-config
        - name: signing
          secret:
            secretName: {{ include "dbagent.signingKeySecretName" . }}
            items:
              - key: ed25519.key.pub
                path: ed25519.key.pub
        - name: bootstrap-ca
          {{- if .Values.probeGateway.bootstrapCA.existingSecret }}
          secret:
            secretName: {{ .Values.probeGateway.bootstrapCA.existingSecret }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "dbagent.fullname" . }}-bootstrap-ca
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbagent.fullname" . }}-probe-gateway
  labels:
    {{- include "dbagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: probe-gateway
spec:
  type: {{ .Values.probeGateway.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: probe-gateway
  ports:
    - name: session
      port: 8443
      targetPort: session
    - name: bootstrap
      port: 8444
      targetPort: bootstrap
    - name: internal
      port: 8080
      targetPort: internal
      {{- if and (eq (.Values.probeGateway.service.type | default "ClusterIP") "NodePort") .Values.probeGateway.service.nodePort }}
      nodePort: {{ .Values.probeGateway.service.nodePort }}
      {{- end }}
