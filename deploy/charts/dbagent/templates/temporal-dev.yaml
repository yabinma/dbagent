{{- if eq .Values.temporal.mode "dev" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbagent.fullname" . }}-temporal
  labels:
    {{- include "dbagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: temporal
    spec:
      containers:
        - name: temporal
          image: {{ .Values.temporalDev.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 7233
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PWD
              value: {{ .Values.postgresql.auth.password | quote }}
            - name: POSTGRES_SEEDS
              value: {{ printf "%s-postgresql" (include "dbagent.fullname" .) | quote }}
            - name: DBNAME
              value: temporal
            - name: VISIBILITY_DBNAME
              value: temporal_visibility
            # Register the namespace the services connect to (values
            # config.temporal.namespace; design.md §11.2.3 C.1 row 22).
            - name: DEFAULT_NAMESPACE
              value: {{ .Values.config.temporal.namespace | quote }}
          resources:
            {{- toYaml .Values.temporalDev.resources | nindent 12 }}
          livenessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            tcpSocket: { port: grpc }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbagent.fullname" . }}-temporal
  labels:
    {{- include "dbagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
{{- else if eq .Values.temporal.mode "chart" }}
{{- /* Official Temporal subchart is rendered via Chart.yaml dependency when temporal.chart.enabled=true. */ -}}
{{- else if eq .Values.temporal.mode "external" }}
{{- /* Nothing rendered; config.temporal.address points at the operator cluster. */ -}}
{{- else }}
{{- fail (printf "temporal.mode must be dev|chart|external, got %q" .Values.temporal.mode) }}
{{- end }}
