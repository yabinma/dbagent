apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbagent.fullname" . }}-ingest-gateway
  labels:
    {{- include "dbagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest-gateway
spec:
  replicas: {{ .Values.ingestGateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ingest-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ingest-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: ingest-gateway
          image: {{ include "dbagent.image" (dict "global" .Values.global "name" .Values.images.ingestGateway) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ include "dbagent.secretName" . }}
          env:
            - name: DBAGENT_GATEWAY_CONFIG
              value: /etc/dbagent/config.yaml
            - name: DBAGENT_GATEWAY_WORKERS
              value: {{ .Values.ingestGateway.workers | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/dbagent
              readOnly: true
          resources:
            {{- toYaml .Values.ingestGateway.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            {{- include "dbagent.probeTuning" .Values.ingestGateway.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            {{- include "dbagent.probeTuning" .Values.ingestGateway.probes.readiness | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: {{ include "dbagent.fullname" . }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbagent.fullname" . }}-ingest-gateway
  labels:
    {{- include "dbagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest-gateway
spec:
  type: {{ .Values.ingestGateway.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingest-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- if and (eq (.Values.ingestGateway.service.type | default "ClusterIP") "NodePort") .Values.ingestGateway.service.nodePort }}
      nodePort: {{ .Values.ingestGateway.service.nodePort }}
      {{- end }}
