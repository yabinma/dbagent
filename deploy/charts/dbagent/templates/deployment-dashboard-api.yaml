apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbagent.fullname" . }}-dashboard-api
  labels:
    {{- include "dbagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard-api
spec:
  replicas: {{ .Values.dashboardApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard-api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dashboard-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: dashboard-api
          image: {{ include "dbagent.image" (dict "global" .Values.global "name" .Values.images.dashboardApi) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - secretRef:
                name: {{ include "dbagent.secretName" . }}
          env:
            - name: DBAGENT_DASHBOARD_CONFIG
              value: /etc/dbagent/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/dbagent
              readOnly: true
          resources:
            {{- toYaml .Values.dashboardApi.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            {{- include "dbagent.probeTuning" .Values.dashboardApi.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            {{- include "dbagent.probeTuning" .Values.dashboardApi.probes.readiness | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: {{ include "dbagent.fullname" . }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbagent.fullname" . }}-dashboard-api
  labels:
    {{- include "dbagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard-api
spec:
  type: {{ .Values.dashboardApi.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard-api
  ports:
    - name: http
      port: 8081
      targetPort: http
      {{- if and (eq (.Values.dashboardApi.service.type | default "ClusterIP") "NodePort") .Values.dashboardApi.service.nodePort }}
      nodePort: {{ .Values.dashboardApi.service.nodePort }}
      {{- end }}
