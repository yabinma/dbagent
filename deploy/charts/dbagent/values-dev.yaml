# Self-contained dev/e2e install — NOT a production configuration.
# Bundled PostgreSQL uses emptyDir (data does not survive pod restart).
# Usage:
#   helm install dbagent ./deploy/charts/dbagent -n dbagent --create-namespace \
#     -f deploy/charts/dbagent/values-dev.yaml

postgresql:
  bundled: true
minio:
  bundled: true
modelGateway:
  bundled: true
temporal:
  mode: dev
