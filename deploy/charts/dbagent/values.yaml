# dbagent umbrella chart defaults (design.md §11.1.3)

global:
  imageRegistry: ghcr.io/yabinma/dbagent
  imagePullPolicy: IfNotPresent
  appVersion: "0.1.0"

images:
  ingestGateway: ingest-gateway
  temporalWorker: temporal-worker
  probeGateway: probe-gateway
  dashboardApi: dashboard-api
  dashboardWeb: dashboard-web

config:
  # Appendix E role routes. When modelGateway.bundled=true the ConfigMap
  # rewrites every role's model to `mock` (the only name the bundled
  # gateway serves).
  models:
    planner:     {model: "ollama/qwen2.5:14b",               max_tokens: 2000}
    collector:   {model: "ollama/qwen2.5:14b",               max_tokens: 2000}
    rca:         {model: "bedrock/anthropic.claude-fable-5", max_tokens: 8000}
    remediation: {model: "bedrock/anthropic.claude-fable-5", max_tokens: 4000}
  temporal:
    # When temporal.mode=dev the ConfigMap rewrites this to {{Release}}-temporal:7233.
    # For mode=external, set temporal.address (or this field) to the operator endpoint.
    address: "temporal:7233"
    namespace: dbagent
    task_queue: rca-worker
  storage:
    postgres_dsn: "${PG_DSN}"
    # Appendix E nested shape (storage.s3.*). When minio.bundled=true the
    # ConfigMap rewrites endpoint to http://{{Release.Name}}-minio:9000.
    # For external MinIO, set the full URL here (or leave bundled=false).
    # No s3.region: Appendix E and rca_common have no home for it.
    s3:
      endpoint: "http://minio:9000"
      bucket: dbagent
      access_key: "${S3_ACCESS_KEY}"
      secret_key: "${S3_SECRET_KEY}"
  model_gateway:
    # Same rewrite rule as storage.s3.endpoint when modelGateway.bundled=true.
    url: "http://model-gateway:4000"
    master_key: "${LITELLM_MASTER_KEY}"
  # Always rendered by this chart as {{Release.Name}}-probe-gateway. The ConfigMap
  # fills the release-qualified URL when this block is omitted or still bare.
  # Override url for an external probe-gateway.
  probe_gateway:
    url: "http://probe-gateway:8080"
  signing:
    key_path: /etc/dbagent/signing/ed25519.key
    rotation_grace_seconds: 600
  dashboard:
    jwt_secret: "${DASHBOARD_JWT_SECRET}"
    cors_origins: []
    bootstrap_ca_cert_path: ""
  notifications:
    outbound_webhooks: []
  ingest:
    sources: []
  budget_defaults:
    max_rounds: 15
    max_cost_usd: 10.0
    max_wall_seconds: 1800
  agents: {}
  tracing:
    backend: builtin

secrets:
  create: true
  existingSecret: ""
  data:
    # External default host; when postgresql.bundled=true, secret-app uses dbagent.pgDsn.
    PG_DSN: "postgresql://dbagent:dbagent@postgresql:5432/dbagent"
    S3_ACCESS_KEY: "minioadmin"
    S3_SECRET_KEY: "minioadmin"
    LITELLM_MASTER_KEY: "sk-local"
    DASHBOARD_JWT_SECRET: "change-me-in-production"
    GRAFANA_WEBHOOK_SECRET: ""
    SLACK_WEBHOOK_URL: ""
    ADMIN_USERNAME: "admin"
    ADMIN_INITIAL_PASSWORD: "admin-change-me"

ingestGateway:
  replicaCount: 1
  # FP-IG-20: worker count is the reference environment's core count (§14.4
  # = 4). One uvicorn event loop per core inside the single replica; not a
  # uvicorn default and not replicaCount (which stays 1).
  workers: 4
  # FP-IG-34: per-worker open-connection ceiling (§11.3.3 AJ). Effective
  # aggregate capacity = workers × (value − 1); must satisfy
  # workers × (value − 1) ≥ BURST_RATE × P99_MS / 1000 + TOTAL_REQUESTS // 100
  # and workers × value < MAX_IN_FLIGHT (recomputed by the delivery test).
  maxConnectionsPerWorker: 150
  service:
    type: ClusterIP
    nodePort: null
  # FP-IG-1/2: every probe parameter explicit; sourced from one place.
  probes:
    liveness:
      timeoutSeconds: 5
      periodSeconds: 15
      failureThreshold: 7
      successThreshold: 1
    readiness:
      timeoutSeconds: 3
      periodSeconds: 10
      failureThreshold: 3
      successThreshold: 1
  # FP-IG-4 / FP-IG-23: sizingBasis is the ingest gateway's per-request CPU
  # cost in milliseconds, measured by FP-IG-7's benchmark. requests.cpu =
  # ceil(basis x 200) m and limits.cpu = exactly 5 x requests.cpu, both
  # re-derived from this ledger once it carries its five observations.
  #
  # The figure below is a HISTORICAL LABEL and is VOID as provenance
  # (FP-IG-23 / clause Z): every run behind it failed B1 clauses, reached
  # MAX_IN_FLIGHT, and carried cpus=16 rather than the reference 4. It
  # certifies nothing and is not re-certified by the signature below.
  #
  # B1-LATENCY-BASIS-1 owns the replacement warrant. A qualifying
  # observation is an ordinary CI-scale `benchmark` run at ONE collection
  # head on the ONE GC-3-selected CPU model
  # (tests/benchmark/b1_topology_decision.json), meeting the unchanged
  # CI-scale bar: 15000 offered, 15000 served and committed, zero errors,
  # served rate >= 450/s, due-time p99 < 150 ms, max in flight < 500,
  # platform online, a valid placement witness and a stable four-worker
  # identity. `observations` holds exactly five such rows; `collection`
  # holds every dispatch from the first through the fifth accepted one,
  # each either linked to its observation or discarded with its exact
  # route/clause reason. Both stay EMPTY, and `signature`'s
  # collection-time fields stay null, until the coordinator records real
  # GitHub run identities: no id, cost or discard here may be fabricated,
  # copied from an investigation, or written by a tool.
  # tests/delivery/test_delivery_sizing_ledger.py is the gate.
  sizingBasis:
    cpuMsPerRequest: 2.427
    signature:
      headSha: null
      cpus: 4
      cpuModel: null
      image: null
      workers: 4
      referenceTopology: null
      placementSchema: null
      topologyDecisionHeadSha: null
    collection:
      attempts: []
    observations: []
  resources:
    # CPU still carries the void label above and is re-derived from the
    # recorded ledger, never from this comment. Memory is W x the shipped
    # per-process 128Mi / 512Mi (copied, not derived - §11.3.3 X).
    requests: { cpu: 486m, memory: 512Mi }
    limits: { cpu: 2430m, memory: 2Gi }

temporalWorker:
  replicaCount: 1
  probes:
    liveness:
      timeoutSeconds: 5
      periodSeconds: 30
      failureThreshold: 4
      successThreshold: 1
    readiness:
      timeoutSeconds: 3
      periodSeconds: 15
      failureThreshold: 3
      successThreshold: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

probeGateway:
  replicaCount: 1
  # FP-IG-30(a): finite database/sql pool. Rendered as a bare unquoted int
  # into the probe-gateway ConfigMap (`max_db_conns`); required at the serve
  # path (absent / <= 0 refuses to start). No ${} — envexpand re-tags
  # placeholder scalars !!str and yaml.v3 cannot decode !!str into int.
  maxDbConns: 10
  service:
    type: ClusterIP
    # NodePort for the internal (:8080) health/admin port when type=NodePort.
    nodePort: null
  extraSANs: []
  probes:
    liveness:
      timeoutSeconds: 5
      periodSeconds: 15
      failureThreshold: 7
      successThreshold: 1
    readiness:
      timeoutSeconds: 3
      periodSeconds: 10
      failureThreshold: 3
      successThreshold: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  bootstrapCA:
    persistence:
      enabled: true
      size: 64Mi
      storageClass: ""
    existingSecret: ""
  heartbeatTimeout: 60s
  heartbeatCheckInterval: 15s
  signingKeyPollInterval: 30s

dashboardApi:
  replicaCount: 1
  service:
    type: ClusterIP
    nodePort: null
  probes:
    liveness:
      timeoutSeconds: 5
      periodSeconds: 15
      failureThreshold: 7
      successThreshold: 1
    readiness:
      timeoutSeconds: 3
      periodSeconds: 10
      failureThreshold: 3
      successThreshold: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

dashboardWeb:
  replicaCount: 1
  service:
    type: ClusterIP
    nodePort: null
  probes:
    liveness:
      timeoutSeconds: 5
      periodSeconds: 15
      failureThreshold: 7
      successThreshold: 1
    readiness:
      timeoutSeconds: 3
      periodSeconds: 10
      failureThreshold: 3
      successThreshold: 1
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
  apiBaseUrl: /api/v1

ingress:
  enabled: false
  className: ""
  hosts: []
  tls: []

networkPolicy:
  enabled: false

# temporal.mode: dev | chart | external
# Default external: operator-managed Temporal (pair with postgresql.bundled: false).
# For self-contained dev/e2e use -f values-dev.yaml (or tests/e2e/values-dbagent.yaml).
# When mode=chart, set chart.enabled=true so the vendored subchart renders.
temporal:
  mode: external
  chart:
    enabled: false
  address: ""
  # Official Temporal subchart value overrides (only when chart.enabled=true).
  # v1.6+ uses server.config.persistence.datastores (no top-level cassandra/es).
  server:
    replicaCount: 1
    config:
      persistence:
        defaultStore: default
        visibilityStore: visibility
        numHistoryShards: 512
        datastores:
          default:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal
              connectAddr: "postgresql:5432"
              connectProtocol: "tcp"
              user: dbagent
              password: dbagent
          visibility:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal_visibility
              connectAddr: "postgresql:5432"
              connectProtocol: "tcp"
              user: dbagent
              password: dbagent
# Bundled PostgreSQL is dev/e2e only (emptyDir, default password). Production must
# set bundled: false and supply an external DSN via secrets.
postgresql:
  bundled: false
  # FP-IG-29: connection supply for bundled PG only. Derived from AH's demand
  # table (145 at the shipped topology) + RESERVE 13 (3 superuser_reserved
  # + 10 transient) = 158, rounded up to 160 as one-direction slack. Slack
  # can only widen supply; FP-IG-31 asserts the recomputed inequality, so
  # the slack buys no laxity on demand. Edited only when AH's demand table
  # changes, in the same commit.
  maxConnections: 160
  image: postgres:16-alpine
  auth:
    database: dbagent
    username: dbagent
    password: dbagent
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }

minio:
  bundled: false
  image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
  mcImage: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
  rootUser: minioadmin
  rootPassword: minioadmin
  bucket: dbagent
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

modelGateway:
  bundled: false
  image: ghcr.io/berriai/litellm:main-v1.55.8
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

temporalDev:
  image: temporalio/auto-setup:1.24.2
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
