# dbagent umbrella chart defaults (design.md §11.1.3)

global:
  imageRegistry: ghcr.io/yabinma/dbagent
  imagePullPolicy: IfNotPresent
  appVersion: "0.1.0"

images:
  ingestGateway: ingest-gateway
  temporalWorker: temporal-worker
  probeGateway: probe-gateway
  dashboardApi: dashboard-api
  dashboardWeb: dashboard-web

config:
  temporal:
    # When temporal.mode=dev the ConfigMap rewrites this to {{Release}}-temporal:7233.
    # For mode=external, set temporal.address (or this field) to the operator endpoint.
    address: "temporal:7233"
    namespace: dbagent
    task_queue: rca-worker
  storage:
    postgres_dsn: "${PG_DSN}"
    # Bare compose-style default. When minio.bundled=true the ConfigMap rewrites
    # this to http://{{Release.Name}}-minio:9000. For external MinIO, set the full
    # URL here (or leave bundled=false and override).
    s3_endpoint: "http://minio:9000"
    s3_bucket: dbagent
    s3_access_key: "${S3_ACCESS_KEY}"
    s3_secret_key: "${S3_SECRET_KEY}"
    s3_region: us-east-1
  model_gateway:
    # Same rewrite rule as s3_endpoint when modelGateway.bundled=true.
    url: "http://model-gateway:4000"
    master_key: "${LITELLM_MASTER_KEY}"
  # Always rendered by this chart as {{Release.Name}}-probe-gateway. The ConfigMap
  # fills the release-qualified URL when this block is omitted or still bare.
  # Override url for an external probe-gateway.
  probe_gateway:
    url: "http://probe-gateway:8080"
  signing:
    key_path: /etc/dbagent/signing/ed25519.key
    rotation_grace_seconds: 600
  dashboard:
    jwt_secret: "${DASHBOARD_JWT_SECRET}"
    cors_origins: []
    bootstrap_ca_cert_path: ""
  notifications:
    outbound_webhooks: []
  ingest:
    sources: []
  budget_defaults:
    max_rounds: 15
    max_cost_usd: 10.0
    max_wall_seconds: 1800
  agents: {}
  tracing:
    backend: builtin

secrets:
  create: true
  existingSecret: ""
  data:
    # External default host; when postgresql.bundled=true, secret-app uses dbagent.pgDsn.
    PG_DSN: "postgresql://dbagent:dbagent@postgresql:5432/dbagent"
    S3_ACCESS_KEY: "minioadmin"
    S3_SECRET_KEY: "minioadmin"
    LITELLM_MASTER_KEY: "sk-local"
    DASHBOARD_JWT_SECRET: "change-me-in-production"
    GRAFANA_WEBHOOK_SECRET: ""
    SLACK_WEBHOOK_URL: ""
    ADMIN_USERNAME: "admin"
    ADMIN_INITIAL_PASSWORD: "admin-change-me"

ingestGateway:
  replicaCount: 1
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

temporalWorker:
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

probeGateway:
  replicaCount: 1
  service:
    type: ClusterIP
    # NodePort for the internal (:8080) health/admin port when type=NodePort.
    nodePort: null
  extraSANs: []
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  bootstrapCA:
    persistence:
      enabled: true
      size: 64Mi
      storageClass: ""
    existingSecret: ""
  heartbeatTimeout: 60s
  heartbeatCheckInterval: 15s
  signingKeyPollInterval: 30s

dashboardApi:
  replicaCount: 1
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

dashboardWeb:
  replicaCount: 1
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
  apiBaseUrl: /api/v1

ingress:
  enabled: false
  className: ""
  hosts: []
  tls: []

networkPolicy:
  enabled: false

# temporal.mode: dev | chart | external
# Default external: operator-managed Temporal (pair with postgresql.bundled: false).
# For self-contained dev/e2e use -f values-dev.yaml (or tests/e2e/values-dbagent.yaml).
# When mode=chart, set chart.enabled=true so the vendored subchart renders.
temporal:
  mode: external
  chart:
    enabled: false
  address: ""
  # Official Temporal subchart value overrides (only when chart.enabled=true).
  # v1.6+ uses server.config.persistence.datastores (no top-level cassandra/es).
  server:
    replicaCount: 1
    config:
      persistence:
        defaultStore: default
        visibilityStore: visibility
        numHistoryShards: 512
        datastores:
          default:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal
              connectAddr: "postgresql:5432"
              connectProtocol: "tcp"
              user: dbagent
              password: dbagent
          visibility:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal_visibility
              connectAddr: "postgresql:5432"
              connectProtocol: "tcp"
              user: dbagent
              password: dbagent
# Bundled PostgreSQL is dev/e2e only (emptyDir, default password). Production must
# set bundled: false and supply an external DSN via secrets.
postgresql:
  bundled: false
  image: postgres:16-alpine
  auth:
    database: dbagent
    username: dbagent
    password: dbagent
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }

minio:
  bundled: false
  image: minio/minio:RELEASE.2024-12-18T13-15-44Z
  mcImage: minio/mc:RELEASE.2025-08-13T08-35-41Z
  rootUser: minioadmin
  rootPassword: minioadmin
  bucket: dbagent
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

modelGateway:
  bundled: false
  image: ghcr.io/berriai/litellm:main-v1.55.8
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

temporalDev:
  image: temporalio/auto-setup:1.24.2
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
