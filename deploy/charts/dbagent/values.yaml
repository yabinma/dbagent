temporalWorker:
  replicaCount: 1
  probes:
    liveness:
      timeoutSeconds: 5
      periodSeconds: 30
      failureThreshold: 4
      successThreshold: 1
    readiness:
      timeoutSeconds: 3
      periodSeconds: 15
      failureThreshold: 3
      successThreshold: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

probeGateway:
  replicaCount: 1
  # FP-IG-30(a): finite database/sql pool. Rendered as a bare unquoted int
  # into the probe-gateway ConfigMap (`max_db_conns`); required at the serve
  # path (absent / <= 0 refuses to start). No ${} — envexpand re-tags
  # placeholder scalars !!str and yaml.v3 cannot decode !!str into int.
  maxDbConns: 10
  service:
    type: ClusterIP
    # NodePort for the internal (:8080) health/admin port when type=NodePort.
    nodePort: null
  extraSANs: []
  probes:
    liveness:
      timeoutSeconds: 5
      periodSeconds: 15
      failureThreshold: 7
      successThreshold: 1
    readiness:
      timeoutSeconds: 3
      periodSeconds: 10
      failureThreshold: 3
      successThreshold: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  bootstrapCA:
    persistence:
      enabled: true
      size: 64Mi
      storageClass: ""
    existingSecret: ""
  heartbeatTimeout: 60s
  heartbeatCheckInterval: 15s
  signingKeyPollInterval: 30s

dashboardApi:
  replicaCount: 1
  service:
    type: ClusterIP
    nodePort: null
  probes:
    liveness:
      timeoutSeconds: 5
      periodSeconds: 15
      failureThreshold: 7
      successThreshold: 1
    readiness:
      timeoutSeconds: 3
      periodSeconds: 10
      failureThreshold: 3
      successThreshold: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

dashboardWeb:
  replicaCount: 1
  service:
    type: ClusterIP
    nodePort: null
  probes:
    liveness:
      timeoutSeconds: 5
      periodSeconds: 15
      failureThreshold: 7
      successThreshold: 1
    readiness:
      timeoutSeconds: 3
      periodSeconds: 10
      failureThreshold: 3
      successThreshold: 1
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
  apiBaseUrl: /api/v1

ingress:
  enabled: false
  className: ""
  hosts: []
  tls: []

networkPolicy:
  enabled: false

# temporal.mode: dev | chart | external
# Default external: operator-managed Temporal (pair with postgresql.bundled: false).
# For self-contained dev/e2e use -f values-dev.yaml (or tests/e2e/values-dbagent.yaml).
# When mode=chart, set chart.enabled=true so the vendored subchart renders.
temporal:
  mode: external
  chart:
    enabled: false
  address: ""
  # Official Temporal subchart value overrides (only when chart.enabled=true).
  # v1.6+ uses server.config.persistence.datastores (no top-level cassandra/es).
  server:
    replicaCount: 1
    config:
      persistence:
        defaultStore: default
        visibilityStore: visibility
        numHistoryShards: 512
        datastores:
          default:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal
              connectAddr: "postgresql:5432"
              connectProtocol: "tcp"
              user: dbagent
              password: dbagent
          visibility:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal_visibility
              connectAddr: "postgresql:5432"
              connectProtocol: "tcp"
              user: dbagent
              password: dbagent
# Bundled PostgreSQL is dev/e2e only (emptyDir, default password). Production must
# set bundled: false and supply an external DSN via secrets.
postgresql:
  bundled: false
  # FP-IG-29: connection supply for bundled PG only. Derived from AH's demand
  # table (145 at the shipped topology) + RESERVE 13 (3 superuser_reserved
  # + 10 transient) = 158, rounded up to 160 as one-direction slack. Slack
  # can only widen supply; FP-IG-31 asserts the recomputed inequality, so
  # the slack buys no laxity on demand. Edited only when AH's demand table
  # changes, in the same commit.
  maxConnections: 160
  image: postgres:16-alpine
  auth:
    database: dbagent
    username: dbagent
    password: dbagent
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 1Gi }

minio:
  bundled: false
  image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
  mcImage: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
  rootUser: minioadmin
  rootPassword: minioadmin
  bucket: dbagent
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

modelGateway:
  bundled: false
  image: ghcr.io/berriai/litellm:main-v1.55.8
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

temporalDev:
  image: temporalio/auto-setup:1.24.2
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
