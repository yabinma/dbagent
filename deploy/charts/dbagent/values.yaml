    cpuMsPerRequest: 1.585
    signature:
      headSha: 9239325e198fba129eb3b7c6cf328090e4da7c5f
      cpus: 4
      cpuModel: AMD EPYC 7763 64-Core Processor
      image: "os-release:59a77b5f2666d9c8"
      workers: 4
      referenceTopology: gateway-split
      placementSchema: 3
      topologyDecisionHeadSha: 9ffaf346bfc02b973db8c475b57ffd2bf516cd2b
    collection:
      attempts:
      - runId: 35372405142/1
        headSha: 9239325e198fba129eb3b7c6cf328090e4da7c5f
        cpuModel: AMD EPYC 9V74 80-Core Processor
        decisionState: unhostable
        outcome: discarded
        reason: "topology_unratified_sku:AMD EPYC 9V74 80-Core Processor"
