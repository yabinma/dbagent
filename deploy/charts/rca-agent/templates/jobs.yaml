# Install-time Jobs (FP-M6-8).
# Helm runs: pre-install hooks → install resources → --wait → post-install hooks.
# So migrate must be pre-install (schema ready before app Deployments start).
# Secret + bundled PG are earlier-weighted pre-install hooks (see secret-app.yaml,
# postgresql.yaml). Weights: secret/pg -35/-30, migrate -20, signing-key -10,
# bootstrap-admin 0 (post), seed-playbooks 10 (post).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rca-agent.fullname" . }}-migrate
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 12
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: {{ include "rca-agent.image" (dict "global" .Values.global "name" .Values.images.temporalWorker) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # Retry until PostgreSQL accepts connections (bundled PG hook may still
          # be starting when this Job is scheduled).
          command:
            - /bin/sh
            - -c
            - |
              set -e
              i=0
              while [ "$i" -lt 60 ]; do
                if alembic -c /app/alembic.ini upgrade head; then
                  exit 0
                fi
                i=$((i + 1))
                sleep 2
              done
              echo "migrate: alembic upgrade head failed after retries" >&2
              exit 1
          envFrom:
            - secretRef:
                name: {{ include "rca-agent.secretName" . }}
          env:
            - name: RCA_PG_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rca-agent.secretName" . }}
                  key: PG_DSN
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rca-agent.fullname" . }}-signing-key
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rca-agent.fullname" . }}-signing-key
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ include "rca-agent.signingKeySecretName" . }}"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rca-agent.fullname" . }}-signing-key
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rca-agent.fullname" . }}-signing-key
subjects:
  - kind: ServiceAccount
    name: {{ include "rca-agent.fullname" . }}-signing-key
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rca-agent.fullname" . }}-signing-key
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: {{ include "rca-agent.fullname" . }}-signing-key
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: signing-key
          image: {{ include "rca-agent.image" (dict "global" .Values.global "name" .Values.images.temporalWorker) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - python
            - /app/scripts/bootstrap_signing_key.py
            - --key-path
            - /tmp/signing/ed25519.key
            - --k8s-secret
            - {{ include "rca-agent.signingKeySecretName" . | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp/signing
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rca-agent.fullname" . }}-bootstrap-admin
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: bootstrap-admin
          image: {{ include "rca-agent.image" (dict "global" .Values.global "name" .Values.images.dashboardApi) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["rca-dashboard-bootstrap-admin"]
          envFrom:
            - secretRef:
                name: {{ include "rca-agent.secretName" . }}
          env:
            - name: RCA_DASHBOARD_CONFIG
              value: /etc/rca-agent/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/rca-agent
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "rca-agent.fullname" . }}-config
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rca-agent.fullname" . }}-seed-playbooks
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: seed-playbooks
          image: {{ include "rca-agent.image" (dict "global" .Values.global "name" .Values.images.temporalWorker) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - python
            - /app/scripts/seed_playbooks.py
            - --config
            - /etc/rca-agent/config.yaml
          envFrom:
            - secretRef:
                name: {{ include "rca-agent.secretName" . }}
          volumeMounts:
            - name: config
              mountPath: /etc/rca-agent
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "rca-agent.fullname" . }}-config
