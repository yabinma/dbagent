{{- if .Values.modelGateway.bundled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rca-agent.fullname" . }}-litellm
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
      - model_name: mock
        litellm_params:
          model: openai/mock
          api_base: os.environ/MOCK_LLM_URL
          api_key: os.environ/MOCK_LLM_API_KEY
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rca-agent.fullname" . }}-model-gateway
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: model-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: model-gateway
    spec:
      containers:
        - name: model-gateway
          image: {{ .Values.modelGateway.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: {{ include "rca-agent.secretName" . }}
          env:
            - name: MOCK_LLM_URL
              value: "http://mock-llm:8090"
            - name: MOCK_LLM_API_KEY
              value: "not-needed"
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          resources:
            {{- toYaml .Values.modelGateway.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /health/liveliness, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: {{ include "rca-agent.fullname" . }}-litellm
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rca-agent.fullname" . }}-model-gateway
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-gateway
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: model-gateway
  ports:
    - name: http
      port: 4000
      targetPort: http
{{- end }}
