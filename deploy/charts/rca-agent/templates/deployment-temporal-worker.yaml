apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rca-agent.fullname" . }}-temporal-worker
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-worker
spec:
  replicas: {{ .Values.temporalWorker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: temporal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: temporal-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: temporal-worker
          image: {{ include "rca-agent.image" (dict "global" .Values.global "name" .Values.images.temporalWorker) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "rca-agent.secretName" . }}
          env:
            - name: RCA_WORKER_CONFIG
              value: /etc/rca-agent/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/rca-agent
              readOnly: true
            - name: signing
              mountPath: /etc/rca-agent/signing
              readOnly: true
          resources:
            {{- toYaml .Values.temporalWorker.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["python", "-c", "import worker; print('ok')"]
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["python", "-c", "import worker; print('ok')"]
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: {{ include "rca-agent.fullname" . }}-config
        - name: signing
          secret:
            secretName: {{ include "rca-agent.signingKeySecretName" . }}
            items:
              - key: ed25519.key
                path: ed25519.key
              # .pub is written by the signing-key hook Job into the Secret;
              # mount it so bootstrap_signing_key does not need a writable dir.
              - key: ed25519.key.pub
                path: ed25519.key.pub
