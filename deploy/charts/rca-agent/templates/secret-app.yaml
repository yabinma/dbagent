{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rca-agent.secretName" . }}
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
  annotations:
    # Available to pre-install hook Jobs (migrate) before main resources exist.
    # before-hook-creation only — do NOT use hook-succeeded, or the Secret is
    # deleted after hooks and main-release Deployments lose it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-35"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  PG_DSN: {{ include "rca-agent.pgDsn" . | quote }}
  {{- range $k, $v := .Values.secrets.data }}
  {{- if ne $k "PG_DSN" }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
