apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rca-agent.fullname" . }}-ingest-gateway
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest-gateway
spec:
  replicas: {{ .Values.ingestGateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ingest-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ingest-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: ingest-gateway
          image: {{ include "rca-agent.image" (dict "global" .Values.global "name" .Values.images.ingestGateway) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ include "rca-agent.secretName" . }}
          env:
            - name: RCA_GATEWAY_CONFIG
              value: /etc/rca-agent/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/rca-agent
              readOnly: true
          resources:
            {{- toYaml .Values.ingestGateway.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: {{ include "rca-agent.fullname" . }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rca-agent.fullname" . }}-ingest-gateway
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest-gateway
spec:
  type: {{ .Values.ingestGateway.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingest-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- if and (eq (.Values.ingestGateway.service.type | default "ClusterIP") "NodePort") .Values.ingestGateway.service.nodePort }}
      nodePort: {{ .Values.ingestGateway.service.nodePort }}
      {{- end }}
