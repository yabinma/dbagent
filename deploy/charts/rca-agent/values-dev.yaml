# Self-contained dev/e2e install — NOT a production configuration.
# Bundled PostgreSQL uses emptyDir (data does not survive pod restart).
# Usage:
#   helm install rca-agent ./deploy/charts/rca-agent -n rca --create-namespace \
#     -f deploy/charts/rca-agent/values-dev.yaml

postgresql:
  bundled: true
minio:
  bundled: true
modelGateway:
  bundled: true
temporal:
  mode: dev
