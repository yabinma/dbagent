# Local dev / functional-test control-plane stack (design.md Section 11).
# Bare `docker compose up -d` keeps M1 infrastructure-only behavior;
# `--profile apps` brings the whole product up on one node (FP-M6-11).
#
# Usage:
#   docker compose -f deploy/compose/control-plane.yml up -d
#   docker compose -f deploy/compose/control-plane.yml --profile apps up -d

name: dbagent-control-plane

x-app-env: &app-env
  PG_DSN: ${PG_DSN:-postgresql://dbagent:dbagent@postgres:5432/dbagent}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
  DASHBOARD_JWT_SECRET: ${DASHBOARD_JWT_SECRET:-dev-jwt-secret-change-me}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin-change-me}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dbagent
      POSTGRES_USER: dbagent
      POSTGRES_PASSWORD: dbagent
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbagent -d dbagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      # auto-setup:1.24.2 ships config/dynamicconfig/docker.yaml; the previous
      # development-sql.yaml path does not exist in the image and makes the
      # server exit on boot ("stat ...development-sql.yaml: no such file").
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
      # The application's Temporal namespace default is `dbagent`
      # (design.md §11.2.3 C.1 row 22); auto-setup registers `default`
      # unless told otherwise, so register the one the services connect to.
      DEFAULT_NAMESPACE: dbagent
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8088:8080"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/dbagent &&
      exit 0
      "
    restart: "no"

  model-gateway:
    image: ghcr.io/berriai/litellm:main-v1.55.8
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm-config.yaml:/etc/litellm/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      MOCK_LLM_URL: ${MOCK_LLM_URL:-http://host.docker.internal:8090}
      MOCK_LLM_API_KEY: ${MOCK_LLM_API_KEY:-not-needed}
    ports:
      - "4000:4000"

  # --- Application services (profile: apps) ---
  migrate:
    profiles: ["apps"]
    image: ${REGISTRY:-ghcr.io/yabinma/dbagent}/temporal-worker:${APP_VERSION:-0.1.0}
    # entrypoint (not command): the image pins ENTRYPOINT to worker_main, and
    # Compose `command:` only replaces CMD -- so a `command:` override would run
    # `worker_main alembic ...` instead of alembic. K8s `command:` overrides the
    # entrypoint, which is why the chart's Job works with `command:` there.
    entrypoint: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      <<: *app-env
      DBAGENT_PG_DSN: ${PG_DSN:-postgresql://dbagent:dbagent@postgres:5432/dbagent}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  signing-key:
    profiles: ["apps"]
    image: ${REGISTRY:-ghcr.io/yabinma/dbagent}/temporal-worker:${APP_VERSION:-0.1.0}
    # entrypoint (not command): see the migrate service note above.
    entrypoint: ["python", "/app/scripts/bootstrap_signing_key.py", "--key-path", "/etc/dbagent/signing/ed25519.key"]
    volumes:
      - signing-key:/etc/dbagent/signing
    restart: "no"

  bootstrap-admin:
    profiles: ["apps"]
    image: ${REGISTRY:-ghcr.io/yabinma/dbagent}/dashboard-api:${APP_VERSION:-0.1.0}
    # entrypoint (not command): the image pins ENTRYPOINT to dbagent-dashboard-api;
    # see the migrate service note above.
    entrypoint: ["dbagent-dashboard-bootstrap-admin"]
    environment:
      <<: *app-env
      DBAGENT_DASHBOARD_CONFIG: /etc/dbagent/config.yaml
    volumes:
      - ./config/dbagent.yaml:/etc/dbagent/config.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  seed-playbooks:
    profiles: ["apps"]
    image: ${REGISTRY:-ghcr.io/yabinma/dbagent}/temporal-worker:${APP_VERSION:-0.1.0}
    # entrypoint (not command): see the migrate service note above.
    entrypoint: ["python", "/app/scripts/seed_playbooks.py", "--config", "/etc/dbagent/config.yaml"]
    environment:
      <<: *app-env
    volumes:
      - ./config/dbagent.yaml:/etc/dbagent/config.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  ingest-gateway:
    profiles: ["apps"]
    image: ${REGISTRY:-ghcr.io/yabinma/dbagent}/ingest-gateway:${APP_VERSION:-0.1.0}
    environment:
      <<: *app-env
      DBAGENT_GATEWAY_CONFIG: /etc/dbagent/config.yaml
    volumes:
      - ./config/dbagent.yaml:/etc/dbagent/config.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started

  temporal-worker:
    profiles: ["apps"]
    image: ${REGISTRY:-ghcr.io/yabinma/dbagent}/temporal-worker:${APP_VERSION:-0.1.0}
    environment:
      <<: *app-env
      DBAGENT_WORKER_CONFIG: /etc/dbagent/config.yaml
    volumes:
      - ./config/dbagent.yaml:/etc/dbagent/config.yaml:ro
      - signing-key:/etc/dbagent/signing:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      signing-key:
        condition: service_completed_successfully
      temporal:
        condition: service_started

  probe-gateway:
    profiles: ["apps"]
    image: ${REGISTRY:-ghcr.io/yabinma/dbagent}/probe-gateway:${APP_VERSION:-0.1.0}
    environment:
      <<: *app-env
      PROBE_GATEWAY_CONFIG: /etc/dbagent/probe-gateway/config.yaml
    volumes:
      - ./config/probe-gateway.yaml:/etc/dbagent/probe-gateway/config.yaml:ro
      - signing-key:/etc/dbagent/signing:ro
      - bootstrap-ca:/etc/dbagent/probe-gateway-ca
    ports:
      - "8443:8443"
      - "8444:8444"
      - "8082:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      signing-key:
        condition: service_completed_successfully

  dashboard-api:
    profiles: ["apps"]
    image: ${REGISTRY:-ghcr.io/yabinma/dbagent}/dashboard-api:${APP_VERSION:-0.1.0}
    environment:
      <<: *app-env
      DBAGENT_DASHBOARD_CONFIG: /etc/dbagent/config.yaml
    volumes:
      - ./config/dbagent.yaml:/etc/dbagent/config.yaml:ro
    ports:
      - "8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bootstrap-admin:
        condition: service_completed_successfully

  dashboard-web:
    profiles: ["apps"]
    image: ${REGISTRY:-ghcr.io/yabinma/dbagent}/dashboard-web:${APP_VERSION:-0.1.0}
    environment:
      DBAGENT_API_BASE_URL: /api/v1
      DBAGENT_API_UPSTREAM: http://dashboard-api:8081/
    ports:
      - "3000:8080"
    depends_on:
      - dashboard-api

volumes:
  pg-data:
  temporal-pg-data:
  minio-data:
  signing-key:
  bootstrap-ca:
