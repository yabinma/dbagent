# Local dev / functional-test control-plane stack (design.md Section 11,
# M1 deliverables: "local Temporal stack; LiteLLM deployment"). Brings up
# Temporal (+ its own Postgres store), the application Postgres, MinIO
# (S3-compatible object store), and a LiteLLM Proxy (model gateway,
# Section 7). Not consumed directly by the automated M1 functional test
# (`tests/functional/test_m1_foundation.py`), which uses ephemeral
# containers/time-skipping test servers of its own per Section 14.3 so it
# stays hermetic and CI-friendly; this compose file is for interactive
# local development and manual verification of the same M1 acceptance
# criterion end to end.
#
# Usage:
#   docker compose -f deploy/compose/control-plane.yml up -d
#
# Then RCA_WORKER_CONFIG can point `services/worker` at a config file whose
# `storage.postgres_dsn` / `storage.s3.*` / `model_gateway.url` /
# `temporal.address` match the ports below.

name: rca-agent-control-plane

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rca_agent
      POSTGRES_USER: rca_agent
      POSTGRES_PASSWORD: rca_agent
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca_agent -d rca_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8080:8080"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/rca-agent &&
      exit 0
      "
    restart: "no"

  model-gateway:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm-config.yaml:/etc/litellm/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      MOCK_LLM_URL: ${MOCK_LLM_URL:-http://host.docker.internal:8090}
      MOCK_LLM_API_KEY: ${MOCK_LLM_API_KEY:-not-needed}
    ports:
      - "4000:4000"

volumes:
  pg-data:
  temporal-pg-data:
  minio-data:
