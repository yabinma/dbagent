# Docker Swarm stack for the data-plane probe (design.md FP-M6-12).
# Deploy: docker stack deploy -c deploy/compose/probe-swarm-stack.yml dbagent-probe
# Secrets: bootstrap_token, username, password (platform credentials).
# Config:  config.yaml via Docker config.
#
# The probe dials the mounted Docker socket directly (design.md §11.2.3 B,
# FP-SW-2/FP-SW-4): this stack declares NO service other than `probe`, and in
# particular no socket proxy, because a TCP proxy in front of
# /var/run/docker.sock would sit on the Presto overlay network below and hand
# root-equivalent control of the manager node to the very engine the probe is
# deployed to investigate. The `:ro` flag on the mount is NOT a write control
# -- `write_enabled` and the signed write channel are (Section 8.1).
#
# The shipped image runs as non-root UID/GID 65532. A typical host Docker
# socket is root:docker mode 0660, so the service must run with the host
# docker group as primary GID (user: "65532:${DOCKER_SOCKET_GID}"; Swarm
# rejects group_add). Set DOCKER_SOCKET_GID before `docker stack deploy`:
#   export DOCKER_SOCKET_GID="$(stat -c '%g' /var/run/docker.sock)"
# See docs/deployment/swarm.md ("Socket group membership").
#
# Sanitized placeholders (Appendix E.1): set PRESTO_OVERLAY_NETWORK to the
# existing, external Presto overlay network and CONTROL_PLANE_IP to the host
# running the control plane, so the gateway certificate's SAN (`probe-gateway`)
# resolves without DNS.

version: "3.8"

services:
  probe:
    image: ${REGISTRY:-ghcr.io/yabinma/dbagent}/probe:${APP_VERSION:-0.1.0}
    environment:
      PROBE_CONFIG: /etc/dbagent-probe/config.yaml
      # Config uses bootstrap_token: ${BOOTSTRAP_TOKEN}. Swarm cannot inject
      # secret contents into env directly; the probe reads BOOTSTRAP_TOKEN_FILE
      # when the expanded token is empty (Docker secret-file convention).
      BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      # Section 8.4a: the link crosses an untrusted network here, so the pin is
      # REQUIRED. Read the sha256 fingerprint from the dashboard platform page.
      BOOTSTRAP_CA_PIN: ${BOOTSTRAP_CA_PIN:-}
    extra_hosts:
      - "probe-gateway:${CONTROL_PLANE_IP:-127.0.0.1}"
    networks:
      - presto-overlay
    configs:
      - source: probe_config
        target: /etc/dbagent-probe/config.yaml
    secrets:
      - source: bootstrap_token
        target: bootstrap_token
      - source: platform_username
        target: /etc/dbagent-probe/platform-credentials/username
      - source: platform_password
        target: /etc/dbagent-probe/platform-credentials/password
    # Primary GID so non-root 65532 can connect to a root:docker 0660 socket.
    # Swarm stack schema rejects group_add; user: "uid:gid" is the supported
    # form (Compose keeps group_add in probe.yml). Required — without it the
    # probe gets EACCES and exits before enrollment (GET /_ping preflight).
    # Error message must not contain % or nested quotes: docker stack config's
    # interpolator mangles those (unlike docker compose). See swarm.md.
    user: "65532:${DOCKER_SOCKET_GID:?set DOCKER_SOCKET_GID to the host docker group GID}"
    volumes:
      - probe-state:/var/lib/dbagent-probe
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

configs:
  # Swarm-specific config: gateway/bootstrap host is probe-gateway so it
  # matches extra_hosts above (FP-SW-4). Compose single-node keeps
  # config/probe.yaml with host.docker.internal.
  probe_config:
    file: ./config/probe-swarm.yaml

secrets:
  bootstrap_token:
    external: true
  platform_username:
    external: true
  platform_password:
    external: true

networks:
  # The EXISTING Presto overlay, so Swarm service DNS resolves
  # coordinator_service. A non-attachable overlay is normal; a service can
  # still join it.
  presto-overlay:
    name: ${PRESTO_OVERLAY_NETWORK:-presto-overlay}
    external: true

volumes:
  probe-state:
