# Sample mounted config for compose apps profile (secrets via env interpolation).
temporal:
  address: temporal:7233
  namespace: default
  task_queue: rca-worker
storage:
  postgres_dsn: ${PG_DSN}
  s3_endpoint: http://minio:9000
  s3_bucket: rca-agent
  s3_access_key: ${S3_ACCESS_KEY}
  s3_secret_key: ${S3_SECRET_KEY}
  s3_region: us-east-1
model_gateway:
  url: http://model-gateway:4000
  master_key: ${LITELLM_MASTER_KEY}
signing:
  key_path: /etc/rca-agent/signing/ed25519.key
  rotation_grace_seconds: 600
dashboard:
  jwt_secret: ${DASHBOARD_JWT_SECRET}
  cors_origins: []
notifications:
  outbound_webhooks: []
ingest:
  sources: []
budget_defaults:
  max_rounds: 15
  max_cost_usd: 10.0
  max_wall_seconds: 1800
tracing:
  backend: builtin
