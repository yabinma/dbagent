version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Appendix A's probe.proto is the normative, approved wire contract
    # (message/service names are fixed); these style rules would require
    # renaming types the design document specifies verbatim.
    - PACKAGE_DIRECTORY_MATCH
    - SERVICE_SUFFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
