[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rca-common"
version = "0.1.0"
description = "Shared control-plane library: config loader, DB models/migrations, llmclient trace wrapper, Signer (design.md Section 11)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "SQLAlchemy>=2.0,<2.1",
    "asyncpg>=0.29,<0.30",
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.13,<2",
    "boto3>=1.34,<2",
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
    "PyNaCl>=1.5,<2",
    "rfc8785>=0.1.2,<1",
    "jsonschema>=4.21,<5",
    "argon2-cffi>=23.1,<25",
]

[project.optional-dependencies]
langfuse = ["langfuse>=2.0,<3"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "moto[s3]>=5.0",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["rca_common*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
