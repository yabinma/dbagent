[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rca-worker"
version = "0.1.0"
description = "Temporal worker process hosting workflows/activities (design.md Section 5, 11). M3: InvestigationWorkflow + 4 agent Activities."
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7,<2",
    "rca-common",
    "httpx>=0.27,<1",
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "testcontainers>=4.0,<5",
    "PyYAML>=6.0,<7",
    "respx>=0.21",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.setuptools.package-data]
worker = ["agents/prompts/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
