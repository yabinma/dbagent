[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rca-gateway"
version = "0.1.0"
description = "Ingest-gateway: HMAC webhook, fingerprint dedup/correlation, start InvestigationWorkflow (design.md Section 3.2, 4.1)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "temporalio>=1.7,<2",
    "rca-common",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27,<1",
    "testcontainers>=4.0,<5",
    "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
