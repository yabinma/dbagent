[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rca-dashboard-api"
version = "0.1.0"
description = "Dashboard API: cases, approvals (Temporal Signals), metrics, admin (design.md Section 10.2 / Appendix D)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "temporalio>=1.7,<2",
    "PyJWT>=2.7,<3",
    "argon2-cffi>=23.1,<25",
    "httpx>=0.27,<1",
    "rca-common",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27,<1",
    "testcontainers>=4.0,<5",
    "PyYAML>=6.0,<7",
]

[project.scripts]
rca-dashboard-api = "dashboard_api.main:main"
rca-dashboard-bootstrap-admin = "dashboard_api.bootstrap_admin:main"

[tool.setuptools.packages.find]
include = ["dashboard_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
